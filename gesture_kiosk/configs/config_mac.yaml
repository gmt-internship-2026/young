# gesture_kiosk 맥(개발 PC) 전용 설정 — config.yaml과 같은 구조, 맥 환경 차이만 다르다
# 사용: python scripts/run_demo.py --config configs/config_mac.yaml
# 원본과 다른 점 (docs/MAC_RUN_LOG.md 참고):
#   demo_ui.port: 5000 → 5001   (맥 AirPlay 수신기(ControlCenter)가 5000 선점)
#   announce.backend: tts       (pyttsx3가 맥 nsss로 동작 — 미설치면 자동 log 폴백)

camera:
  device_id: 0            # 맥 내장(MacBook Pro) 카메라
  width_px: 1280
  height_px: 720
  mirror: true
  windows_backend: auto   # 맥에서는 무시된다
  fourcc: mjpg            # 캡처 픽셀 포맷 — 맥 내장 카메라는 무시될 수 있다 (무해)

model:
  # 라이선스(2026-07-15 2차): rtmlib RTMPose(Apache-2.0) — 쓸기·잠금. 맥은 CPU 실행(개발 확인용)
  device: auto            # 맥: CUDA 없음 -> 자동으로 cpu
  use_tensorrt: false
  pose_mode: lightweight  # ★ 맥 CPU — 가벼운 포즈 모델로 개발 확인
  input_size_px: 640
  max_infer_fps: 60
  idle_infer_fps: 10      # 유휴 시 추론 FPS 하향 — config.yaml 주석 참고 (2026-07-20 GMtech 이식)
  redetect_interval_frames: 10  # 2026-07-16 성능 최적화 — config.yaml 주석 참고
  bbox_pad_ratio: 0.3

hand_model:                # MediaPipe HandLandmarker(Apache-2.0) — 선택 판정 (2026-07-16 재도입)
  weights_path: models/weights/hand_landmarker.task
  num_hands: 1
  min_hand_detection_conf: 0.5
  min_hand_presence_conf: 0.5
  min_tracking_conf: 0.5
  infer_interval_frames: 3  # 2026-07-16 성능 최적화 — config.yaml 주석 참고

person_lock:
  enabled: true
  kpt_conf_threshold: 0.3
  lock_frame_count: 3
  follow_radius_ratio: 0.25
  release_sec: 2.0
  sharpness_weight: 0.5

gestures:
  cooldown_sec: 1.2       # swipe.window_sec보다 길게 (config.yaml 주석 참고)
  swipe:                   # 좌/우 이동 전용 — 위/아래는 hand_swipe로 이관 (config.yaml 주석 참고)
    window_sec: 1.0         # 2026-07-16 0.6→1.0 (저FPS 대응 — config.yaml 주석 참고)
    min_dist_x_ratio: 0.25
    min_dist_y_ratio: 0.25
    axis_dominance: 1.5
    min_track_frames: 3     # 2026-07-16 4→3 (config.yaml 주석 참고)
    elbow_gain: 2.0         # 손목 미검출 시 팔꿈치 폴백 배율 — config.yaml 주석 참고
  hand_swipe:              # 손(모양 무관) 위/아래 이동 = go_home/go_back (2026-07-20 신설,
                           # 같은 날 실측 후 임계값 재조정 — config.yaml 주석 참고)
    window_sec: 1.0
    min_dist_x_ratio: 0.4
    min_dist_y_ratio: 0.08
    axis_dominance: 1.5
    min_track_frames: 3
  select:                 # 손가락 1개(엄지 제외)를 제자리에서 유지 — config.yaml 주석 참고
                           # (2026-07-20: 화면 전환은 hand_swipe로 이관)
    required_finger_count: 1
    hold_sec: 0.6

announce:
  enabled: true
  backend: tts            # 맥 nsss — pyttsx3 미설치 시 자동 log 폴백
  rate_wpm: 200
  volume: 1.0
  voice_keyword: "ko"      # 맥 nsss 보이스는 이름 대신 id에 로캘 코드(ko-KR 등)가
                            #   들어가는 경우가 많아 윈도우와 다른 키워드를 쓴다
                            #   (config.yaml 주석 참고) — 실제 보이스명은 실기 확인 필요
  event_templates:
    move_left: "왼쪽으로 이동"
    move_right: "오른쪽으로 이동"
    select: "선택했습니다"
    go_back: "이전 화면으로 이동합니다"
    go_home: "처음 화면으로 돌아갑니다"
  status_templates:
    locked: "사용자가 인식되었습니다"
    released: "사용자 인식이 해제되었습니다. 화면 앞에 서 주세요"

classes:
  [move_left, move_right, select, go_back, go_home]

event_output:
  mode: console
  udp:
    host: 127.0.0.1
    port: 9999

demo_ui:
  host: 0.0.0.0
  port: 5001              # ★ 맥: 5000은 AirPlay 수신기가 선점 → 5001 사용
  stream_fps: 15
  jpeg_quality: 75

logging:
  level: INFO
  save_dir: logs/

runtime:
  python_version: "3.11.5"   # 배포 기준 — 맥 개발 venv(3.10)는 검증용이라 무관
  target_os: windows
  target_gpu: nvidia
