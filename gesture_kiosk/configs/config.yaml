# gesture_kiosk 설정 — 모든 튜닝값의 단일 출처 (기획서 4.7 : 코드에 숫자 하드코딩 금지)
#
# 2026-07-10 전면 개편 — 타깃: 윈도우 + Python 3.11.5 (정부 민원발급기)
# 2026-07-24 win 통합판(feat/think_win): 구 win_cpu/win_gpu 브랜치 통합 —
#   NVIDIA GPU가 있으면 CUDA로, 없으면 CPU로 자동 실행 (device/pose_mode: auto)
# 2026-07-23 동작 체계 (「제스처 정의 보고서」 손 모양 기준 — 회사 확정 이벤트 명):
#   한 손가락 + 좌/우/위/아래 = left/right/top/bottom (포커스 이동 — 탐색 계층)
#   주먹 + 왼쪽/위/오른쪽 = back(이전) / home(처음으로) / ok(확인) — 명령 계층
#   손 모양이 계층을, 이동 방향이 기능을 정한다 — 반복 횟수·화면 좌표 안 씀.
#   판별은 wholebody 손 21점 기하 규칙(hand_shape.py) — 손 모양 CNN 없음.
#   구 스펙(위 1회=select·아래 1회/2연속 분기)·손목/팔꿈치 폴백은 07-23 제거.

camera:
  model: "Logitech Brio 100"  # 사용 카메라 기종 기록(2026-07-16 신설) — 실측 검증 2026-07-10.
                              #   OpenCV는 장치 이름을 못 읽으므로 사람이 기록. 교체 시 갱신 —
                              #   시작 로그의 "카메라 협상 결과"에 협상값과 나란히 남는다
  device_id: 0            # USB 웹캠 장치 번호
  width_px: 1280
  height_px: 720
  mirror: true            # 거울 모드 — 사용자 기준 좌/우와 쓸기 방향을 일치시킨다
  windows_backend: msmf   # 윈도우 캡처 백엔드: msmf | dshow | auto
                          #   Brio 100 실측(2026-07-10): dshow는 YUY2 720p로만 협상돼 ~5 FPS,
                          #   msmf는 30 FPS. 오픈이 수십 초 걸리는 장치면 dshow로 되돌릴 것
  fourcc: mjpg            # 캡처 픽셀 포맷 — 무압축(YUY2) 720p는 USB 한계로 ~5 FPS. auto면 미설정
                          #   (msmf는 이 설정을 무시하기도 한다 — dshow 계열 카메라용)

model:
  # 라이선스(2026-07-15 2차): rtmlib RTMPose(Apache-2.0) **포즈 단일 모델** —
  # 쓸기·사용자 잠금이 전부 이 키포인트로 판정된다 (구 방식 전부 제거)
  pose_engine: wholebody  # wholebody(전신 133) **필수** — 새 스펙(2026-07-23)은 손 모양
                          #   (주먹/한 손가락) 판별에 손 21점이 필요하다. body(몸 17)는
                          #   손 키포인트가 없어 제스처가 동작하지 않는다.
                          #   ★CPU 실행 시 30 FPS 미달이어도 body 하향 금지(제스처 불가) —
                          #   input_size_px 480으로 대응
  device: auto            # auto(CUDA 있으면 cuda, 없으면 cpu — 시작 로그에서 확인) | cuda | cpu
  use_tensorrt: false     # true면 TensorRT 가속(NVIDIA GPU 전용) — 첫 실행 때 이 PC 전용 엔진 캐시 생성
  pose_mode: auto         # auto(2026-07-24 통합판): 위 device 판별이 cuda면 balanced(정확),
                          #   cpu면 lightweight(30 FPS 확보). 수동 고정: lightweight | balanced | performance
  input_size_px: 640
  max_infer_fps: 60       # 추론 루프 FPS 상한 — 초과분은 대기 (GPU 낭비 방지).
                          #   2026-07-16 30→60 상향(사용자 결정 — 제한 완화). ★주의: 2026-07-10
                          #   실측에서 CPU 추론 루프가 60으로 돌 때 캡처 스레드의 CPU/GIL을
                          #   빼앗아 캡처 FPS 반토막 → CPU 기기에서 인식 저하 시 30으로 되돌릴 것
  idle_infer_fps: 10      # 유휴(사람 없음·잠금 없음) 시 추론 FPS — 키오스크 대기 시간의
                          #   CPU·전력 절감 (2026-07-20). 사람이 감지되면 즉시 max로 복귀
  det_interval_frames: 10 # 사람 검출(YOLOX) 실행 간격 — 추적 중엔 N프레임에 1회만 돌리고
                          #   사이엔 신뢰도 통과 사람의 박스만 재사용(자체 미니 트래커,
                          #   2026-07-20 2차 — 검출 0명이면 포즈 생략: 허수 포즈·CPU 낭비 차단).
                          #   사람이 안 보이면 즉시 검출 재개. 1=검출 매 프레임

person_lock:              # 오토포커스 카메라 — 초점 맞은 사용자에게 잠금, 다른 사람 무시
  enabled: true
  kpt_conf_threshold: 0.3     # 포즈 키포인트(손목·어깨·머리) 최소 신뢰도
  lock_frame_count: 3         # 최고 점수 후보가 N프레임 연속이면 그 사용자에게 잠금
  follow_radius_ratio: 0.25   # 잠금 유지·추적 반경 (프레임 폭 대비 비율) — 아래 IoU
                              #   매칭 실패 시(빠르게 움직인 같은 사람)의 폴백에만 쓰인다
  follow_min_iou: 0.3         # 잠금 전이 차단(2026-07-22 실기 — 대기줄에서 잠금이 옆
                              #   사람에게 넘어감): 직전 잠금 몸 박스와 겹침(IoU)이 이 이상인
                              #   사람만 같은 사용자로 잇는다. 옆/뒤 사람은 겹침이 작아 배제 →
                              #   가까이 있어도 잠금을 못 뺏는다. 키 삭제 시 종전(최근접) 동작
  follow_size_ratio_range: [0.5, 2.0]  # IoU 약할 때 폴백의 크기 게이트 — 후보 몸 박스
                              #   면적이 잠금 박스의 0.5~2.0배일 때만 인정(원근이 다른 뒤/앞
                              #   사람 배제). 빠르게 움직인 같은 사람은 크기가 비슷해 통과
  release_sec: 2.0            # 이 시간 동안 안 보이면 잠금 해제 — 다음 사용자 인식
  sharpness_weight: 0.5       # 사용자 선정 점수에서 초점 선명도 비중 (0=크기만, 1=선명도만)
  hand_shape:                 # 손 모양 판별(2026-07-23 새 스펙 — hand_shape.py 기하 규칙)
    extend_ratio: 1.35        # 손가락 "펴짐" 기준 — 손끝-손목뿌리 거리가 둘째 관절(PIP)-뿌리
                              #   거리의 N배 이상. 주먹 오판(펴짐 과다 인정) 잦으면 ↑,
                              #   한 손가락을 주먹으로 놓치면 ↓ (실기 계기판 hand_shape로 튜닝)
    min_valid_fingers: 3      # 판별에 필요한 판단 가능 손가락(검지~새끼) 최소 개수 —
                              #   미만이면 모양 불명(None): 블러·원거리에서 단정하지 않는다
    min_center_points: 5      # 손 중심(추적점) 인정 최소 키포인트 수 — 미만이면 손 없음 처리
    curl_confirm_ratio: 0.9   # 굽힘 "확인" 기준(07-23 v2 — 원근 단축 오판 대응): 손끝-뿌리가
                              #   PIP-뿌리의 이 비율 이하(또는 관절 방향 반전)일 때만 굽힘.
                              #   그 사이(0.9~1.35)는 기권 — 카메라 쪽으로 누운 손가락이
                              #   주먹으로 오판되던 실기 사례(가리키기 자세) 차단.
                              #   주먹을 자꾸 놓치면 ↑(1.0~1.1), 오판 남으면 ↓
  reach_limit_shoulder:       # 해부학적 도달 거리 게이트(2026-07-20) — 추적점이 같은 쪽
                              #   어깨에서 어깨너비 N배 안일 때만 인정. 톱다운 포즈가 몸 박스에
                              #   걸친 **옆 사람의 손**을 사용자 손으로 출력하는 오귀속 차단
                              #   (실기 관찰). 어깨 미검출 프레임은 게이트 생략(측면 자세 보호)
    hand: 2.2                 # 손 중심 — 팔 전체+손 길이 + 여유

gestures:
  cooldown_sec: 1.0           # 이벤트 확정 직후 입력 무시 시간 — 연타 방지.
                              #   swipe.window_sec보다 길게 유지할 것 —
                              #   쿨다운이 지나면 쓸기 궤적의 잔여 점이 전부 만료되게
  swipe:                      # 팔 쓸기 — 포즈 궤적 판정: 손이 없는 사용자도 동일 (범용 설계)
    # 거리 임계 단위 = **어깨너비 배수** (2026-07-16 정규화) — 카메라 거리·설치 위치가
    # 달라져도 "자기 어깨너비의 몇 배를 움직였나"로 판정돼 같은 동작이 같은 결과를 낸다
    window_sec: 0.8           # 이 시간 안의 이동량으로 판정 — 느긋한 쓸기 허용
                              #   (2026-07-16 0.6→0.8, cooldown_sec보다 짧게 유지)
    min_dist_x_shoulder: 0.55 # 좌/우 쓸기 확정 최소 이동 (어깨너비 배수 ≈ 22cm)
                              #   2026-07-16 실기 2차 완화: 팔꿈치 고정 전완 플릭도 인식되게
                              #   (1.1→0.8→0.55 — 오탐은 최소 프레임·주축 우세·삼킴이 방어)
    min_dist_y_shoulder: 0.35 # 위/아래 쓸기 확정 최소 이동 (어깨너비 배수 ≈ 14cm)
    axis_dominance: 1.5       # 주축 진행도가 부축의 N배 이상일 때만 확정 — 대각선 오인 보류
    min_track_frames: 4       # 최소 궤적 프레임 — 키포인트 튐 1~2프레임 오발 방지
    # 플릭 경로(2026-07-22 — 사람마다 동작 크기 제각각): 이동량이 위 임계에 못 미쳐도
    # **최근 짧은 구간(flick_window_sec)** 에서 flick_min_dist 이상 단호하게 움직였으면
    # 확정한다. 손목만 까딱하는 작은 플릭을 살리고, 느린 배회는 어느 짧은 구간에서도
    # 미달이라 걸러진다. 계기판 swipe_speed_x/y(어깨너비/초, 최근 구간)를 보며 튜닝 —
    # 실기 전 초안값. 키(flick_window_sec) 삭제 시 종전(이동량 단독) 동작
    flick_window_sec: 0.2      # 최근 이동을 재는 구간 — 이 안에 아래 이동이 나면 플릭.
                               #   전체 창(window_sec)이 아니라 최근 구간이라 정지 후 튀는
                               #   빠른 동작을 잡는다(전체 창은 앞선 정지에 희석돼 놓침)
    flick_min_dist_shoulder: 0.28  # 그 구간의 최소 이동(어깨너비) — 임계 0.55/0.35보다 낮게.
                               #   작은 동작 놓치면 ↓, 오발 잦으면 ↑. 정지 떨림 오발도 이 바닥이 차단
    switch_margin_y_shoulder: 0.2 # 한 팔만 인식: 양팔이 다 보이면 더 높이 든 팔이 활성 —
                                  #   높이 차가 어깨너비의 20% 미만이면 현재 팔 유지 (교체 진동 방지)
    fist_vote_dominance: 1.5  # 주먹 확정 우세 조건(07-23 v2): 주먹 표가 한손가락 표의 N배
                              #   초과일 때만 명령 계층 인정 — 명령 오발(화면 이탈·실행)이
                              #   탐색 오발(한 칸 이동)보다 훨씬 비싸다. 1.0 = 단순 다수
    shape_hold_sec: 2.0       # 모양 기억(07-23 v2): 다수결 결정 불가(기권 다수 — 화면을
                              #   가리켜 손가락이 카메라 쪽으로 누운 자세 등) 시 이 시간 안의
                              #   최근 확정 모양을 이어받는다 — 포인팅 항법 유지. 0 = 기억 없음.
                              #   주의: 모양을 바꾼 직후 첫 동작이 옛 모양으로 나가면 ↓(1.0~1.5)
    return_suppress_sec: 1.6  # 반대 방향 1회 삼킴 창 — 동작 후 이 시간 안 + 아래 위치 조건을
                              #   모두 만족하는 반대 쓸기 1건을 복귀로 무시 (쿨다운 1초보다 길게).
                              #   2026-07-16 실기: 2.5는 의도적 반대 쓸기(우→좌)까지 먹어 단축
    return_origin_shoulder: 0.6   # 복귀 위치 조건 — 반대 쓸기의 시작점이 직전 획 끝에서
                                  #   어깨너비 0.6배 안일 때만 복귀로 인정 (중앙에서 다시
                                  #   시작하는 의도적 쓸기는 시간 창 안이어도 통과)
    return_reach_shoulder: 0.4    # 복귀 종료 기준(2026-07-22 — 속도 경로 대응) — 복귀가
                                  #   직전 획 **출발지**를 어깨너비 0.4배 이상 지나치면 단순
                                  #   복귀가 아니라 반대로 크게 쓰는 의도적 동작이라 삼킴 해제.
                                  #   속도 경로가 복귀 꼬리를 잘게 재검출해도 출발지 안이면
                                  #   계속 삼켜 오발 방지. 키 삭제 시 0(지나침 판정 없음)
    dropout_grace_sec: 0.15   # 소실 유예(2026-07-20) — 빠른 동작의 모션 블러로 추적점이
                              #   순간(1~2프레임) 끊겨도 이 시간 안이면 궤적을 유지한다:
                              #   즉시 리셋하면 빠른 쓸기가 통째로 유실(시뮬 실증).
                              #   팔 교체는 좌표가 달라 유예 없이 리셋 유지 (주먹↔한 손가락
                              #   모양 전환은 손 중심 좌표가 연속이라 리셋 대상 아님)
    raise_guard_below_shoulder: 1.2  # 팔 들어올리기 게이트(2026-07-20 실기) — 추적점이
                              #   어깨선 아래 어깨너비 1.2배(휴식 존 — 팔 처진 위치)에 최근
                              #   머물렀다면 위 방향을 이벤트(top·home)로 치지 않는다: 동작 전
                              #   들어올리기가 확인/처음으로 오발되던 것 차단. 키 삭제 시 게이트 없음
    raise_guard_grace_sec: 0.6    # 휴식 존 이탈 후 이 시간 안의 위 쓸기는 들어올리기 —
                              #   들고 나서 이만큼 멈춘 뒤의 위 스냅은 정상 top/home
    point_filter:             # 추적점 One Euro 필터 (2026-07-20 정확도 1단계 — 떨림 저감).
                              #   속도 적응형: 정지 시 떨림을 강하게 거르고 빠른 쓸기는 지연 없이
                              #   따라간다 (point_filter.py 주석 — 공개 알고리즘 직접 구현, 의무 없음)
      enabled: true
      min_cutoff_hz: 1.5      # 정지 시 컷오프 — 낮출수록 떨림 제거 강함(대신 느린 동작 지연↑)
      beta: 1.0               # 속도 반응 계수 — 클수록 빠른 쓸기에서 원신호를 더 믿는다(지연↓)
      d_cutoff_hz: 1.0        # 속도 추정 자체의 평활 컷오프 (보통 1.0 고정)
    body_scale:               # 어깨너비 자(尺)의 안정화 — person_lock.user_shoulder_width_ratio
      fallback_ratio: 0.22    # 어깨 미검출 시 가정값(어깨너비/프레임폭) — 키오스크 표준 거리 기준.
                              #   이 값일 때 위 임계들이 종전 화면 비율 임계와 정확히 등가
      min_ratio: 0.05         # 하한 클램프 — 측면으로 돌아 어깨가 좁아져도 임계 과민 방지.
                              #   2026-07-16 0.08→0.05: 멀리(앉아서) 있는 사용자의 실제 어깨가
                              #   하한에 걸리면 요구 이동량이 부풀어 원거리 인식이 어려워진다
      max_ratio: 0.32         # 상한 클램프(2026-07-16) — 카메라 근접 시 요구 이동량이
                              #   화면폭 ~26%를 넘지 않게: 팔이 프레임을 나가기 전에 확정된다
      alpha: 0.1              # EMA 평활 계수 — 프레임 단위 출렁임 흡수

classes:                    # 표준 동작 목록 — UI/이벤트 수신부와의 계약
                            # (2026-07-23 회사 확정 명칭: 한 손가락 4방향 + 주먹 3명령)
  [left, right, top, bottom, back, home, ok]

event_output:
  # 회사 GUI = 델파이7 프로그램 — 파이프(stdio) 연동 확정(2026-07-23, 회사 요청
  # "print만"): 엔진이 이벤트를 **표준 출력(stdout)에 한 줄씩** 찍고, 델파이가
  # 엔진을 자식 프로세스로 띄워 익명 파이프로 읽는다. 네트워크(UDP·웹소켓) 전면
  # 철회 — 포트·방화벽 이슈 소멸. 규격: GESTURE|이벤트|손|신뢰도|시각 (한 줄,
  # CRLF 종료 — docs/델파이7_연동가이드.md). 로그는 stderr·파일로만 나가 stdout이
  # 이벤트 전용 채널로 유지된다
  mode: stdio             # stdio(파이프 연동 — 배포 기본) | console(로그만 — 개발)

logging:
  level: INFO
  save_dir: logs/

runtime:                  # 배포 기준 명세 — 설치가이드.md와 일치해야 한다
  python_version: "3.11.5"
  target_os: windows
  target_gpu: auto        # 통합판 — NVIDIA GPU 있으면 사용, 없으면 CPU (시작 로그의 실측값과 대조)
  hardware:               # 타깃 하드웨어 명세 기록(2026-07-16 신설) — №12 기기 확정 시 채울 것.
                          #   시작 로그에 실제 감지값(OS·CPU·RAM·가속기)과 나란히 남아 대조된다
    device_model: 미확정   # 기기 모델명 (예: 미니PC 제조사·모델)
    cpu: 미확정
    ram: 미확정
    accelerator: 자동 감지 (NVIDIA GPU 있으면 CUDA, 없으면 CPU)
