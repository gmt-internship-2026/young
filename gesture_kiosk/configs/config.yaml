# gesture_kiosk 설정 — 모든 튜닝값의 단일 출처 (기획서 4.7 : 코드에 숫자 하드코딩 금지)
#
# 2026-07-10 전면 개편 — 타깃: 윈도우 + Python 3.11.5 (정부 민원발급기)
# 2026-07-24 win 통합판(feat/think_win): 구 win_cpu/win_gpu 브랜치 통합 —
#   NVIDIA GPU가 있으면 CUDA로, 없으면 CPU로 자동 실행 (device/pose_mode: auto)
# 2026-07-29 포즈 스택 제거(사용자 결정): 추론 = MediaPipe HandLandmarker 단독
#   (TFLite/XNNPACK, Apache-2.0). 포즈가 하던 잠금·자·게이트는 hand_select가
#   손 기반으로 대체 — 한 명 사용 가정. onnxruntime·rtmlib·GPU 스택 소멸
# 2026-07-28 손 모델 교체: 손 판별을 MediaPipe HandLandmarker(hand_tracker 섹션)로
# 2026-07-29 동작 체계 개편(사용자 결정 — 상하 포커스 제거, 위=select, ok→confirm):
#   한 손가락 + 좌/우/위 = left/right/select (포커스 이동 — 탐색 계층)
#   주먹 + 왼쪽/위/오른쪽 = back(이전) / home(처음으로) / confirm(확인) — 명령 계층
#   아래 방향 = 정의 없음(두 모양 공통 — top/bottom 소멸).
#   손 모양이 계층을, 이동 방향이 기능을 정한다 — 반복 횟수·화면 좌표 안 씀.
#   (07-23 체계: left/right/top/bottom/back/home/ok — 07-29 위와 같이 개편)

camera:
  model: "Logitech Brio 100"  # 사용 카메라 기종 기록(2026-07-16 신설) — 실측 검증 2026-07-10.
                              #   OpenCV는 장치 이름을 못 읽으므로 사람이 기록. 교체 시 갱신 —
                              #   시작 로그의 "카메라 협상 결과"에 협상값과 나란히 남는다
  device_id: 0            # USB 웹캠 장치 번호
  width_px: 1280
  height_px: 720
  mirror: true            # 거울 모드 — 사용자 기준 좌/우와 쓸기 방향을 일치시킨다
  windows_backend: msmf   # 윈도우 캡처 백엔드: msmf | dshow | auto
                          #   Brio 100 실측(2026-07-10): dshow는 YUY2 720p로만 협상돼 ~5 FPS,
                          #   msmf는 30 FPS. 오픈이 수십 초 걸리는 장치면 dshow로 되돌릴 것
  fourcc: mjpg            # 캡처 픽셀 포맷 — 무압축(YUY2) 720p는 USB 한계로 ~5 FPS. auto면 미설정
                          #   (msmf는 이 설정을 무시하기도 한다 — dshow 계열 카메라용)
  recovery_timeout_sec: 3.0  # 런타임 자동 복구(2026-07-28) — 프레임이 이 시간 동안 안 오면
                          #   끊김(USB 탈락·드라이버 멈춤)으로 보고 장치를 닫고 재연결을
                          #   반복한다. 무인 키오스크에서 조용한 정지 방지 — 복구 중에도
                          #   파이프라인은 마지막 프레임으로 생존. 키 없어도 기본값으로 켜짐
  recovery_retry_sec: 2.0 # 재연결 시도 간격 — 너무 짧으면 드라이버 초기화 중에 계속 실패
  auto_select:            # A안(2026-07-28) — 시작 시 카메라 프로브: 웹캠 2대 구성(№12)에서
                          #   손 인식 품질이 가장 높은 장치를 메인으로 자동 선택.
                          #   (2026-07-29 포즈 제거 — 얼굴 감지율 항목 소멸: 손 품질 단독)
                          #   장치 열거 순서가 바뀌어도 올바른 카메라가 잡히고, IR 카메라 등
                          #   인식 불가 장치는 자동 탈락. ★프로브 순간 카메라 앞에서 손을
                          #   보여야 유효 — 전 장치 0점이면 위 device_id 폴백 (camera_probe.py)
    enabled: false  # 2026-08-03 배포 기본 off(사용자 결정 — 카메라 1대 확정):
                    #   프로브 생략 = 시작 즉시 + 장치 열거 지연·오픈 행 위험 제거.
                    #   카메라 2대 구성으로 바뀌면 true로 (손 품질 자동 선별)
    probe_device_count: 4 # 장치 번호 0..N-1 시도 — 없는 번호는 열기 실패로 건너뜀
    warmup_frames: 5      # 장치당 버리는 초기 프레임 (자동 노출 안정화)
    probe_frames: 15      # 장치당 채점 프레임 — 30 FPS 기준 0.5초 (시작 지연과 트레이드오프)
    probe_timeout_sec: 3.0  # 장치당 시간 한도 — MSMF는 오픈 직후 read 실패가 흔해
                          #   (2026-07-28 실기) 성공 프레임 기준으로 세되 이 시간에 자른다
    probe_open_timeout_sec: 15.0  # 장치 **오픈** 한도(2026-07-31 키오스크 실기 — 엔진
                          #   먹통): MSMF는 오픈 자체가 장치에 따라 무한 대기한다 —
                          #   장치 1 오픈에서 프로브가 통째로 멈췄다. 정상 장치(Brio)도
                          #   이 PC에서 오픈 ~11초 실측이라 그보다 여유 있게 15초.
                          #   초과 장치는 건너뛴다(콘솔 경고). 오픈이 느린 정상 카메라가
                          #   자꾸 제외되면 ↑
    good_hand_span_ratio: 0.10  # 손 크기 만점 기준 — 손 랜드마크 폭이 프레임 폭의 이
                          #   비율이면 크기 점수 1.0 (2026-07-29 품질 채점: 이진 감지는
                          #   앉은 사용자에서 위·아래 카메라가 동점 — 손이 크게 보이는
                          #   구도 좋은 카메라가 이기도록 크기×신뢰도로 채점)

model:                    # 추론 루프 설정 — 2026-07-29 포즈 스택 제거(사용자 결정)로
                          #   포즈 키(pose_engine·device·pose_mode·det_interval 등)는
                          #   전부 소멸. 추론 모델은 hand_tracker(MediaPipe) 하나다
  max_infer_fps: 60       # 추론 루프 FPS 상한 — 초과분은 대기.
                          #   ★주의: 2026-07-10 실측 — CPU 추론 루프가 60으로 돌 때 캡처
                          #   스레드의 CPU/GIL을 빼앗아 캡처 FPS 반토막 → 인식 저하 시 30으로
  idle_infer_fps: 10      # 유휴(손 없음) 시 추론 FPS — 키오스크 대기 시간의
                          #   CPU·전력 절감 (2026-07-20). 손이 보이면 즉시 max로 복귀

hand_tracker:             # 손 랜드마크 — MediaPipe HandLandmarker (2026-07-28 도입,
                          #   Apache-2.0). 보이는 손만 보고(유령 손 없음) + 좌/우 내장
                          #   + z(깊이) 제공 — 판별 임계는 person_lock.hand_shape
  model_path: models/weights/hand_landmarker.task  # download_weights.py가 받는다
                          #   (mediapipe 1.0은 모델을 wheel에 담지 않음 — 오프라인
                          #   번들은 이 파일을 그대로 복사하면 된다)
  max_num_hands: 4        # 프레임 전체 손 상한 — 옆 사람 손은 person_lock의 도달
                          #   거리 게이트가 거른다. 키오스크 앞 2명(4손) 가정
  min_detection_conf: 0.4 # 손바닥 검출 최소 신뢰도 — 낮추면 원거리 손을 더 잡지만 오검출↑.
                          #   2026-07-28 실기: 멀어지면 인식 저하 — 0.5→0.4 (오검출은
                          #   person_lock 도달 거리 게이트가 2차 방어)
  min_presence_conf: 0.4  # 추적 유지 중 손 존재 신뢰도 — 미달이면 재검출로 복귀
  min_tracking_conf: 0.4  # 프레임 간 추적 신뢰도 — 미달이면 재검출 (블러·빠른 이동)
  roi_zoom:               # 원거리 디지털 줌(2026-07-31 실기 — 거리별 인식 편차: 멀면
                          #   좌/우 쓸기 저하·주먹/한 손가락 구분 불가): 손바닥 검출기는
                          #   프레임 전체를 고정 크기(~192px)로 줄여 봐서, 먼 손은 캡처
                          #   해상도와 무관하게 몇 픽셀로 뭉개진다. 앵커(머리) 주변 팔
                          #   도달 반경만 잘라 손 추론에 넣어 손을 모델 입력에서 키운다
                          #   — 해상도 인상(USB 대역·FPS 비용)과 달리 비용이 거의 없다.
                          #   앵커 부재·근거리(크롭≈프레임)면 자동으로 전체 프레임.
                          #   키(roi_zoom) 삭제 시 종전(항상 전체 프레임)
    pad_reach_ratio: 1.3  # 크롭 반변 = 팔 도달 반경(reach_head_widths×머리폭) × N —
                          #   반경 밖 면제 획(쓸기 끝점)까지 담는 여유. 획 끝이 잘리면 ↑
    min_side_px: 320      # 크롭 최소 한 변 — 초원거리에서 크롭이 지나치게 작아지는 것 방지
    move_ratio: 0.15      # 재중심 문턱 — 크롭 중심이 변(邊)의 이 비율 이상 움직일 때만
                          #   창 이동: 매 프레임 옮기면 VIDEO 모드 추적 ROI가 어긋나
                          #   재검출이 반복된다 (히스테리시스)
    resize_ratio: 0.2     # 크기 갱신 문턱 — 변이 이 비율 이상 변할 때만 창 크기 변경

head_anchor:              # 머리 앵커(2026-07-31 몸통판 — 얼굴 검출 교체, 사용자 결정):
                          #   얼굴 검출(BlazeFace)은 마스크·썬글라스·모자·색상 조합에서
                          #   가림으로 실패 — 포즈(BlazePose)는 **몸 실루엣으로 사람을
                          #   잡고 머리 위치를 골격으로** 출력해 얼굴에 뭘 썼든 무관하다.
                          #   시선추적 모듈(회사 예정)과의 얼굴 처리 충돌도 회피 — 이
                          #   판은 얼굴을 아예 다루지 않는다. 앵커 동작(최대=사용자·
                          #   sticky·경성 게이트·연속 면제·좌/우 재라벨)은 얼굴판 그대로.
                          #   모델 = MediaPipe Pose Landmarker lite(Apache-2.0 — 상업
                          #   허용·코드공개/저작권표시 의무 없음, ~5MB, 단일 인물).
                          #   섹션 삭제 시 머리 앵커 없음(종전 — 크기+연속성 선별만)
  model_path: models/weights/pose_landmarker_lite.task  # download_weights.py가 받는다
  min_detection_conf: 0.5 # 사람(포즈) 검출 최소 신뢰도 — 가림과 무관해 완화 불필요
  infer_fps: 10           # 머리 추론 주기 — **별도 스레드**에서 돈다(2026-07-31 키오스크
                          #   실기: 포즈 lite는 호출당 수십 ms — 손 루프 인라인이던 종전
                          #   구조는 10Hz마다 프레임을 밀어 FPS 저하 + 빠른 쓸기 추적
                          #   끊김. realtime_loop 스레드 분리로 손 루프 비차단).
                          #   머리 위치는 천천히 변해 10이면 충분
  reach_head_widths: 5.0  # 팔 도달 반경 = 앵커 머리 폭(귀-귀) × N (성인 ≈ 0.15m × 5 =
                          #   0.75m). 머리 폭 비례라 카메라 거리 무관 같은 실거리.
                          #   내 손이 잘리면 ↑, 옆 사람 손이 새면 ↓.
                          #   ★경성 게이트(2026-07-31 2차 — 실기: 내린 손 자리에 옆 사람
                          #   손이 잡힘): 앵커가 살아 있으면 반경 밖 새 손 차단(추적 연속
                          #   면제만 예외). 상체 미노출 등 앵커 부재 시엔 전부 통과
  shoulder_below_head_widths: 1.6  # 어깨선 추정 = 귀 중점 y + 귀-귀 폭 × N
                          #   (2026-07-31 키오스크 실기 — run.bat은 화면이 없어 사용자가
                          #   프레임 안 자기 위치를 모름: 휴식 존이 화면 하단 띠(절대
                          #   좌표)뿐이면 카메라 각도 따라 위 쓸기가 계속 삼켜졌다).
                          #   귀 높이→어깨 실거리 ≈ 0.25m ≈ 귀-귀 폭 1.6배 — 휴식 존이
                          #   몸 기준으로 서서 카메라 거치와 무관해진다. 위 쓸기가
                          #   여전히 삼켜지면 ↑(존 축소), 들어올리기 오발이 늘면 ↓.
                          #   키 삭제 시 종전(어깨선 없음 — 하단 띠 폴백)
  anchor_grace_sec: 1.0   # 머리 소실 유예 — 이 시간까지 앵커 유지(잠깐 가림 흡수).
                          #   초과 시 게이트 해제(모든 손 통과).
                          #   ★sticky(2026-07-31 실기 — 앵커가 다른 관측으로 옮겨감):
                          #   앵커가 살아 있는 동안 다른 머리는 크기 무관 무시, 교체는
                          #   사용자가 떠나 유예가 앵커를 푼 뒤에만 (hand_select)

hand_select:              # 사용자 손 선별(2026-07-31 단일 손 추적 — 라벨 제거, 사용자
                          #   결정): 좌/우 라벨을 정체성 키에서 버리고 공간 연속성으로
                          #   손 **하나**를 추적한다 — handedness 불안정발 버그 계열
                          #   (획 씹힘·배구 토스) 구조 제거. 거리 자(尺)는 손 실측 크기
                          #   (월드 랜드마크 미터) 기반 가상 어깨너비 — 기존 임계 체계 유지
  release_sec: 2.0        # 손이 이 시간 동안 안 보이면 사용 종료 — 유휴 전환 + 추적
                          #   정체성 해제(다음 손은 획득부터 — 다른 사용자 승계 차단)
  acquire:                # 획득 기준(구 command_hand_lock v2의 라벨 없는 계승) — 모양이
                          #   보이는 손이 실제로 움직이면 사용자 손. 쉬는 손·떠 있는
                          #   손은 영원히 안 잡힌다 (들어 올리는 동작 자체가 획득이 됨)
    move_dist_shoulder: 0.25  # 획득 최소 이동(어깨너비) — 떨림(±0.02)보다 훨씬 크고
                          #   플릭(0.28)보다 살짝 작게. 쉬는 손·잡음에 오획득되면 ↑
    window_sec: 0.5       # 획득 이동을 재는 최근 구간(초)
  hand_shape:                 # 손 모양 판별(hand_shape.py 기하 규칙 — 2026-07-28 v3:
                              #   입력이 MediaPipe 21점이라 아래 비율은 **3D 거리** 기준.
                              #   min_center_points는 제거 — MediaPipe가 21점을 항상 채움)
    extend_ratio: 1.05        # 손가락 "펴짐" 기준 — 손끝-손목뿌리 3D 거리가 둘째 관절(PIP)-
                              #   뿌리 거리의 N배 이상.
                              #   ★2026-08-03 보정 세션 재확인(사용자 결정 — 보수적 조정):
                              #   굽힘 0.53~0.74(p90) · 폄 1.37~1.44로 **0.75~1.37이 완전히
                              #   비어** 있다. 0.95→1.05로 올려 굽힌 손가락이 순간 "폄"으로
                              #   읽히던 프레임(주먹→한 손가락 오판 28/152)을 줄인다 —
                              #   폄 실측 하한(1.37)과 멀어 인식 손해는 없다.
                              #   (2026-07-28 1차 보정 1.35→0.95 이력: 당시 세운 검지
                              #   1.33~1.39, 가리키는 검지 1.04~1.34 — 가리키기도 "폄"이
                              #   되어야 탐색 항법이 유지된다는 근거는 지금도 유효)
    min_valid_fingers: 3      # 판별에 필요한 판단 가능 손가락(검지~새끼) 최소 개수 —
                              #   미만이면 모양 불명(None): 블러·원거리에서 단정하지 않는다
    curl_confirm_ratio: 0.85  # 굽힘 "확인" 기준: 손끝-뿌리가 PIP-뿌리의 이 비율 이하(또는
                              #   관절 방향 반전)일 때만 굽힘. 그 사이(0.85~0.95)는 기권.
                              #   2026-07-28 실측: 굽힌 손가락은 전 자세에서 0.51~0.78 —
                              #   0.85면 여유 있게 덮고 폄(≥1.04)과 안 겹친다 (0.9→0.85)
    classifier_weights_path: models/weights/hand_shape_classifier.npz
                              # 학습 분류기(2026-08-03 CPU 브랜치 이식 — 사용자 요청: 위
                              #   기하 임계값만으론 손가락 개수 판별이 실기에서 조금씩
                              #   흔들려서, fist/finger 경계는 학습 분류기가 대신 정한다
                              #   (hand_select._classify_shape). open(손바닥)은 분류기가
                              #   그 클래스를 아직 몰라(2255건 전부 fist/finger) 계속 기하
                              #   판정 — open도 모아 재학습하면(scripts/
                              #   train_hand_shape_classifier.py) 자동으로 넘어간다.
                              #   ⚠ 원본 데이터는 지금은 없는 구 손 추적기(HandEstimator,
                              #   7/28 이전)로 수집돼 좌표 특성이 다를 수 있다 — 실기에서
                              #   체감이 오히려 나쁘면 이 키를 지워 기하 판정 단독으로
                              #   되돌릴 것(설정 켜기 전 회귀 없음, 옵트인 구조)
                              #   ⚠ 검증 인물 1명(me)뿐 — 과적합 여부 미확인, 실기로 판단

gestures:
  tap_click:                  # 한 손가락 제자리 더블 탭 = click (2026-07-31 사용자 요청).
                              #   ★2026-08-03 판정 방식 교체(보정 세션 실측 + 사용자 결정):
                              #   종전엔 손 전체가 "주먹"으로 읽히는 순간을 셌는데, 검지만
                              #   까딱하면 비율이 1.35→0.97까지만 내려가 주먹 기준선(0.85)에
                              #   **아예 도달하지 않는다** — 감지율 0/8·3/6으로 사실상 미동작
                              #   이었고, 현장에서도 "손목을 크게 두 번 해야 인식"됐다.
                              #   이제 **검지 비율의 일시적 하강**으로 읽는다 (모양 판별과
                              #   무관 — gesture_filter._update_tap_click). 키 삭제 시 기능 없음
    dip_drop_ratio: 0.20      # 까딱 판정 — 검지 비율이 기준선(폄 상태 최대) 대비 이 비율
                              #   이상 내려갔다 돌아오면 1회. ★실측(2026-08-03): 기준선
                              #   1.347 · 떨림은 1.142(p10) 아래로 잘 안 내려가고 의도적
                              #   까딱은 0.967까지 — 20%선(1.078)이 둘을 정확히 가른다
                              #   (하강 폭별 감지: 10%→21회, 15%→20회, 20%→12회, 25%→3회,
                              #   30%→0회 / 기대 8회). 안 잡히면 ↓, 떨림 오발이면 ↑
    window_sec: 1.2           # 첫 까딱 직전부터 둘째 복귀까지 시간 한도 — 탭 2번이
                              #   이 안에 끝나야 한다. 느긋한 탭이 안 잡히면 ↑
    max_move_shoulder: 0.25   # 제자리 반경(어깨너비) — 초과 이동 시 처음부터.
                              #   쓸기·이동 중 블러 출렁임의 click 오발 차단.
                              #   실측(2026-08-03): 탭 중 손 이동은 0.023(p90)으로 매우 작다
  cooldown_sec: 0.9           # 이벤트 확정 직후 입력 무시 시간 — 연타 방지.
                              #   swipe.window_sec보다 길게 유지할 것 —
                              #   쿨다운이 지나면 쓸기 궤적의 잔여 점이 전부 만료되게.
                              #   2026-07-28 실기(노트북): 제스처 후 다음 동작까지
                              #   너무 길다 — 1.0→0.9 (하한: window_sec 0.8 초과 유지)
  swipe:                      # 팔 쓸기 — 포즈 궤적 판정: 손이 없는 사용자도 동일 (범용 설계)
    # 거리 임계 단위 = **어깨너비 배수** (2026-07-16 정규화) — 카메라 거리·설치 위치가
    # 달라져도 "자기 어깨너비의 몇 배를 움직였나"로 판정돼 같은 동작이 같은 결과를 낸다
    window_sec: 0.8           # 이 시간 안의 이동량으로 판정 — 느긋한 쓸기 허용
                              #   (2026-07-16 0.6→0.8, cooldown_sec보다 짧게 유지)
    min_dist_x_shoulder: 0.20 # 좌/우 쓸기 확정 최소 이동 (어깨너비 배수)
                              #   ★2026-08-03 보정 세션 실측(사용자 결정): "작게" 쓸기
                              #   5회가 0.223·0.261·0.282·0.297·0.311, "크게"가 0.56~0.72 —
                              #   종전 0.55는 **작은 동작을 전부 미달**시켜 크게 해야만
                              #   인식됐다(현장 보고와 일치). 작은 쪽 최소값(0.223)보다
                              #   10% 아래로 내려 작은 동작도 정면 경로로 확정된다.
                              #   오발이 늘면 ↑ (잡음 정점은 0.07~0.16으로 측정됨)
                              #   2026-07-16 실기 2차 완화: 팔꿈치 고정 전완 플릭도 인식되게
                              #   (1.1→0.8→0.55 — 오탐은 최소 프레임·주축 우세·삼킴이 방어)
    min_dist_y_shoulder: 0.16 # 위 쓸기(select/home) 확정 최소 이동 (어깨너비 배수).
                              #   ★2026-08-03 보정 세션 실측(사용자 결정): "작게" 위 쓸기
                              #   5회가 0.183·0.194·0.203·0.206·0.226으로 매우 일정한데
                              #   종전 0.30은 **전부 미달** — 현장의 "위만 유독 안 먹힌다"가
                              #   이 수치 그대로였다. 작은 쪽 최소값(0.183)보다 12% 아래로.
                              #   ※위 방향은 들어올리기 게이트(raise_guard)가 2차 방어 —
                              #   오발이 늘면 게이트부터 확인하고 그 다음 이 값을 ↑
                              #   (2026-07-28 0.35→0.30, 07-29 아래 방향 제거 이력)
    axis_dominance: 1.3       # 주축 진행도가 부축의 N배 이상일 때만 확정 — 대각선 오인 보류.
                              #   2026-07-28 실기: 아래 쓸기가 팔꿈치 호 때문에 가로 성분이
                              #   섞여 보류되던 것 완화 (1.5→1.3. 대각선 오인 늘면 복원)
    min_track_frames: 4       # 최소 궤적 프레임 — 키포인트 튐 1~2프레임 오발 방지
    # 플릭 경로(2026-07-22 — 사람마다 동작 크기 제각각): 이동량이 위 임계에 못 미쳐도
    # **최근 짧은 구간(flick_window_sec)** 에서 flick_min_dist 이상 단호하게 움직였으면
    # 확정한다. 손목만 까딱하는 작은 플릭을 살리고, 느린 배회는 어느 짧은 구간에서도
    # 미달이라 걸러진다. 계기판 swipe_speed_x/y(어깨너비/초, 최근 구간)를 보며 튜닝 —
    # 실기 전 초안값. 키(flick_window_sec) 삭제 시 종전(이동량 단독) 동작
    flick_window_sec: 0.2      # 최근 이동을 재는 구간 — 이 안에 아래 이동이 나면 플릭.
                               #   전체 창(window_sec)이 아니라 최근 구간이라 정지 후 튀는
                               #   빠른 동작을 잡는다(전체 창은 앞선 정지에 희석돼 놓침)
    flick_min_dist_shoulder: 0.15  # 그 구간의 최소 이동(어깨너비) — 본 임계(0.20/0.16)보다 낮게.
                               #   ★2026-08-03 정합: 본 임계를 실측대로 내리면서 종전 0.28은
                               #   본 임계보다 커져 플릭 경로가 무의미해졌다 — 0.15로 낮춰
                               #   "짧고 빠른 까딱"이 여전히 먼저 확정되게 유지.
                               #   작은 동작 놓치면 ↓, 오발 잦으면 ↑ (정지 떨림은 이 바닥이 차단)
    first_line:               # 첫 선 방향 고정(2026-07-28 사용자 제안): 방향을 창 전체
                              #   이동량의 주축이 아니라 **원점(정지 지점)을 떠나는 첫 이동
                              #   벡터**로 확정 — 사람마다 궤적(호·갈고리·되돌림)이 달라도
                              #   시작 방향이 의도를 반영한다. 고정 해제는 정지·원점 복귀
                              #   (새 원점 재장전)·꺾임 재고정(아래 relock). 발화 임계·플릭·
                              #   삼킴·게이트는 기존 유지(방향 결정만 교체). 키 삭제 시 종전(창 주축)
      lock_dist_shoulder: 0.12   # 원점에서 이 거리(어깨너비 배수)를 벗어나는 순간의 벡터로
                              #   고정 — 필터 후 떨림(±0.02)보다 크고 임계(0.3~0.55)보다 작게.
                              #   너무 작으면 출발 떨림에 오고정, 너무 크면 호 초입이 섞인다
      still_speed_shoulder: 0.5  # 이 속도(어깨너비/초) 미만이면 "정지" — 원점을 현재 위치로
                              #   갱신하고 고정 해제(재장전). 래치 동결(1.0)보다 낮게
      relock_dist_shoulder: 0.24  # 꺾임 재고정(2026-07-29 실기): 예비 동작(살짝 들기·당기기)이
                              #   방향을 선점하면 진짜 쓸기가 축 불일치로 무시되던 문제 —
                              #   고정 방향 진행이 멈춘 극점에서 이 거리 이상 다른 우세 축으로
                              #   꺾이면 극점을 새 원점 삼아 재고정("새 첫 선"). lock(0.12)의
                              #   2배 — 작은 갈고리 꼬리는 계속 무시. 재고정 오발이 나면 ↑,
                              #   여전히 무반응 체감이면 ↓. 키 삭제 시 재고정 없음(종전)
    # switch_margin_y(높이 비교)·side_flap_jump(라벨 플랩 보정)·command_hand_lock
    # (지시 손 고정 v2)은 2026-07-31 라벨 제거로 소멸 — 손 정체성(획득·이음·해제)은
    # hand_select의 단일 손 추적(acquire·release_sec)이 맡는다
    shape_latch:              # 모양 래치(2026-07-28 v3 — 구 다수결(fist_vote_dominance)·
                              #   모양 기억(shape_hold_sec) 대체): 프레임별 판별 출렁임이
                              #   판정을 오염시키던 것을 상태기로 교정 — 저속에서 연속
                              #   판별로 고정하고, 빠른 이동 중(모션 블러 — 판별이 가장
                              #   부정확한 순간)엔 판별을 무시하며, 반대 모양이 연속 확인될
                              #   때만 전환한다. 해제는 손 소실 시에만. 키 삭제 시 프레임
                              #   추종(래치 없음 — 구 동작 근사)
      latch_frames: 4         # 무래치 → 고정: 같은 판별 N프레임 연속 (30 FPS ≈ 0.13초)
      switch_frames: 8        # 고정 → 반대 모양 전환: 반대 판별 N프레임 연속 (≈0.27초).
                              #   모양을 바꾸면 잠깐(0.3초) 보여준 뒤 쓸어야 한다 — 안내
                              #   문구 대상. 전환이 굼뜨면 ↓(5~6), 오전환 남으면 ↑
      freeze_speed_shoulder: 1.0  # 이 속도(어깨너비/초) 이상 이동 중엔 판별 동결 —
                              #   쓸기 중엔 고정 모양이 그대로 유지된다
      release_sec: 1.5        # 손 소실 후 이 시간 안에 추적 손이 돌아오면 래치 유지
                              #   (2026-07-28 실측: 화면을 가리키면 손바닥이 가려져 손 검출이
                              #   수 초씩 끊긴다 — 즉시 해제하면 재등장마다 재고정 필요).
                              #   같은 손 여부는 hand_select 연속성이 보장(2026-07-31 라벨
                              #   제거) — hand_select.release_sec(2.0)보다 짧게 유지할 것:
                              #   새 손 획득 전에 래치가 먼저 비워져야 승계가 안 된다
    return_suppress_sec: 1.4  # 반대 방향 1회 삼킴 창 — 동작 후 이 시간 안 + 아래 위치 조건을
                              #   모두 만족하는 반대 쓸기 1건을 복귀로 무시 (쿨다운보다 길게).
                              #   2026-07-16 실기: 2.5는 의도적 반대 쓸기(우→좌)까지 먹어 단축.
                              #   2026-07-28 실기(노트북): 재장전 체감 지연 — 1.6→1.4.
                              #   ★1.2는 금지: 쿨다운(0.9)만큼 기다렸다 복귀하는 패턴이
                              #   창 밖으로 새어 반대 이벤트 오발 (시나리오 test_11 검증)
    return_origin_shoulder: 0.6   # 복귀 위치 조건 — 반대 쓸기의 시작점이 직전 획 끝에서
                                  #   어깨너비 0.6배 안일 때만 복귀로 인정 (중앙에서 다시
                                  #   시작하는 의도적 쓸기는 시간 창 안이어도 통과)
    return_reach_shoulder: 0.4    # 복귀 종료 기준(2026-07-22 — 속도 경로 대응) — 복귀가
                                  #   직전 획 **출발지**를 어깨너비 0.4배 이상 지나치면 단순
                                  #   복귀가 아니라 반대로 크게 쓰는 의도적 동작이라 삼킴 해제.
                                  #   속도 경로가 복귀 꼬리를 잘게 재검출해도 출발지 안이면
                                  #   계속 삼켜 오발 방지. 키 삭제 시 0(지나침 판정 없음)
    dropout_grace_sec: 0.35   # 소실 유예(2026-07-20) — 빠른 동작의 모션 블러로 추적점이
                              #   순간 끊겨도 이 시간 안이면 궤적을 유지한다:
                              #   즉시 리셋하면 빠른 쓸기가 통째로 유실(시뮬 실증).
                              #   2026-07-29 실기 0.15→0.35: 주먹 회전(앞면→옆면)의 손
                              #   검출 탈락이 0.15보다 길어 ok 스트로크가 끊겼다
                              #   (1차 방어 — 그보다 긴 탈락은 손목 브리지가 잇는다).
                              #   팔 교체는 좌표가 달라 유예 없이 리셋 유지 (주먹↔한 손가락
                              #   모양 전환은 손 중심 좌표가 연속이라 리셋 대상 아님)
    raise_guard_below_shoulder: 1.2  # 팔 들어올리기 게이트(2026-07-20 실기) — 추적점이
                              #   어깨선 아래 어깨너비 1.2배(휴식 존 — 팔 처진 위치)에 최근
                              #   머물렀다면 위 방향을 이벤트(top·home)로 치지 않는다: 동작 전
                              #   들어올리기가 확인/처음으로 오발되던 것 차단. 키 삭제 시 게이트 없음
    raise_guard_grace_sec: 0.6    # 휴식 존 이탈 후 이 시간 안의 위 쓸기는 들어올리기 —
                              #   들고 나서 이만큼 멈춘 뒤의 위 스냅은 정상 top/home
    point_filter:             # 추적점 One Euro 필터 (2026-07-20 정확도 1단계 — 떨림 저감).
                              #   속도 적응형: 정지 시 떨림을 강하게 거르고 빠른 쓸기는 지연 없이
                              #   따라간다 (point_filter.py 주석 — 공개 알고리즘 직접 구현, 의무 없음)
      enabled: true
      min_cutoff_hz: 1.5      # 정지 시 컷오프 — 낮출수록 떨림 제거 강함(대신 느린 동작 지연↑)
      beta: 1.0               # 속도 반응 계수 — 클수록 빠른 쓸기에서 원신호를 더 믿는다(지연↓)
      d_cutoff_hz: 1.0        # 속도 추정 자체의 평활 컷오프 (보통 1.0 고정)
    body_scale:               # 거리 자(尺)의 안정화 — 2026-07-29부터 hand_select.
                              #   hand_scale_ratio(손 실측 크기 기반 **가상 어깨너비**)가
                              #   공급한다: px/m 환산 × 표준 어깨 0.4m — 어깨 자와 등가라
                              #   위 임계(어깨너비 배수) 숫자가 그대로 유지된다
      fallback_ratio: 0.22    # 손 미관측 시 가정값(가상 어깨너비/프레임폭) — 표준 거리 기준.
                              #   이 값일 때 위 임계들이 종전 화면 비율 임계와 정확히 등가
      min_ratio: 0.05         # 하한 클램프 — 측면으로 돌아 어깨가 좁아져도 임계 과민 방지.
                              #   2026-07-16 0.08→0.05: 멀리(앉아서) 있는 사용자의 실제 어깨가
                              #   하한에 걸리면 요구 이동량이 부풀어 원거리 인식이 어려워진다
      max_ratio: 0.32         # 상한 클램프(2026-07-16) — 카메라 근접 시 요구 이동량이
                              #   화면폭 ~26%를 넘지 않게: 팔이 프레임을 나가기 전에 확정된다
      alpha: 0.1              # EMA 평활 계수 — 프레임 단위 출렁임 흡수

classes:                    # 표준 동작 목록 — UI/이벤트 수신부와의 계약.
                            # 2026-07-31 갱신: 07-29 개편(top/bottom 소멸·ok→confirm)
                            # 반영 + 손바닥 temp 3종·탭 click 추가 (델파이 분기문
                            # 갱신 대상 — №7)
  [left, right, select, back, home, confirm,
   temp_left, temp_right, temp_top, click]

event_output:
  # 회사 GUI = 델파이7 프로그램 — 파이프(stdio) 연동 확정(2026-07-23, 회사 요청
  # "print만"): 엔진이 이벤트를 **표준 출력(stdout)에 한 줄씩** 찍고, 델파이가
  # 엔진을 자식 프로세스로 띄워 익명 파이프로 읽는다. 네트워크(UDP·웹소켓) 전면
  # 철회 — 포트·방화벽 이슈 소멸. 규격: GESTURE|이벤트|손|신뢰도|시각 (한 줄,
  # CRLF 종료 — docs/델파이7_연동가이드.md). 로그는 stderr·파일로만 나가 stdout이
  # 이벤트 전용 채널로 유지된다
  mode: stdio             # stdio(파이프 연동 — 배포 기본) | console(로그만 — 개발)
  format: name            # 출력 규격(2026-07-31 사용자 요청 — cmd 창은 이벤트명만):
                          #   name = 이벤트명 한 줄(left/right/select/back/home/confirm)
                          #   text = GESTURE|이벤트|손|신뢰도|시각 (델파이 가이드 §3 규격)
                          #   키 삭제 시 text(종전). 델파이가 손·신뢰도까지 쓰면 text로

logging:
  level: INFO             # DEBUG면 손 판별 계측(hand_measure — 손가락별 3D 비율·판정)이
                          #   로그 파일에 남는다: 실측 튜닝 세션용 (2026-07-28 신설)
  console_level: WARNING  # 콘솔(stderr)은 이 레벨부터만(2026-07-31 사용자 요청 — cmd 창
                          #   이벤트 한 줄 유지): 시작 리포트·전환·이벤트 INFO 줄은
                          #   파일(level)에만 남는다. 콘솔에서도 보려면 INFO로
  save_dir: logs/

runtime:                  # 배포 기준 명세 — 설치가이드.md와 일치해야 한다
  python_version: "3.11.5"
  target_os: windows
  target_gpu: none        # 2026-07-29 포즈 제거 — 추론은 MediaPipe TFLite(CPU) 단독.
                          #   GPU 스택(torch·onnxruntime-gpu)은 포즈용이었고 함께 소멸
  hardware:               # 타깃 하드웨어 명세 기록(2026-07-16 신설) — №12 기기 확정 시 채울 것.
                          #   시작 로그에 실제 감지값(OS·CPU·RAM·엔진)과 나란히 남아 대조된다
    device_model: 미확정   # 기기 모델명 (예: 미니PC 제조사·모델)
    cpu: 미확정
    ram: 미확정
    accelerator: CPU (MediaPipe TFLite/XNNPACK — 2026-07-29 단독 확정)
