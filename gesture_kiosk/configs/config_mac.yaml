# gesture_kiosk 맥(개발 PC) 전용 설정 — config.yaml과 같은 구조, 맥 환경 차이만 다르다
# 사용: python scripts/run_demo.py --config configs/config_mac.yaml
# 원본과 다른 점 (docs/MAC_RUN_LOG.md 참고):
#   demo_ui.port: 5000 → 5001   (맥 AirPlay 수신기(ControlCenter)가 5000 선점)
#   announce.backend: tts       (pyttsx3가 맥 nsss로 동작 — 미설치면 자동 log 폴백)

camera:
  model: "MacBook Pro 내장 FaceTime HD"  # 사용 카메라 기종 기록(2026-07-16) — config.yaml 주석 참고
  device_id: 0            # 맥 내장(MacBook Pro) 카메라
  width_px: 1280
  height_px: 720
  mirror: true
  windows_backend: auto   # 맥에서는 무시된다
  fourcc: mjpg            # 캡처 픽셀 포맷 — 맥 내장 카메라는 무시될 수 있다 (무해)

model:
  # 라이선스(2026-07-15 2차): rtmlib RTMPose(Apache-2.0) 포즈 단일 모델. 맥은 CPU 실행
  pose_engine: wholebody  # 전신 133 — 손끝 추적 (config.yaml 주석 참고). 맥 CPU로 무거우면 body
  device: auto            # 맥: CUDA 없음 -> 자동으로 cpu
  use_tensorrt: false
  pose_mode: lightweight  # ★ 맥 CPU — 가벼운 포즈 모델로 개발 확인
  input_size_px: 640
  max_infer_fps: 60       # 2026-07-16 30→60 상향(사용자 결정 — config.yaml 주석 참고).
                          #   맥은 전신 모델 추론 실측 28.9 FPS라 상한 미도달(사실상 무영향) —
                          #   캡처 간섭으로 인식 저하 재현 시 30으로 되돌릴 것(2026-07-10 실측 이력)
  idle_infer_fps: 10      # 유휴(사람 없음) 시 추론 FPS 절감 — config.yaml 주석 참고 (2026-07-20)
  det_interval_frames: 10 # 검출은 N프레임에 1회(PoseTracker) — config.yaml 주석 참고 (2026-07-20)

person_lock:
  enabled: true
  kpt_conf_threshold: 0.3
  lock_frame_count: 3
  follow_radius_ratio: 0.25
  release_sec: 2.0
  sharpness_weight: 0.5

gestures:
  cooldown_sec: 1.0       # swipe.window_sec보다 길게 (config.yaml 주석 참고)
  swipe:                    # 임계 단위 = 어깨너비 배수(카메라 거리 무관) — config.yaml 주석 참고
    window_sec: 0.8
    min_dist_x_shoulder: 0.55
    min_dist_y_shoulder: 0.35
    axis_dominance: 1.5
    min_track_frames: 4
    elbow_gain: 2.0         # 손목 미검출 시 팔꿈치 폴백 배율 — config.yaml 주석 참고
    switch_margin_y_shoulder: 0.2   # 한 팔만 인식 — 활성 팔 교체 여유 (config.yaml 주석 참고)
    double_within_sec: 1.2      # 아래 쓸기 1회/2연속 판정 창 — config.yaml 주석 참고
    return_suppress_sec: 1.6    # 반대 방향 1회 삼킴 창 — config.yaml 주석 참고
    return_origin_shoulder: 0.6     # 복귀 위치 조건 — config.yaml 주석 참고
    double_return_min_shoulder: 0.15    # 2연속 전 복귀 확인 — config.yaml 주석 참고
    body_scale:
      fallback_ratio: 0.22
      min_ratio: 0.05         # 원거리 완화 2026-07-16 — config.yaml 주석 참고
      max_ratio: 0.32         # 근거리 상한 — config.yaml 주석 참고
      alpha: 0.1
announce:
  enabled: true
  backend: tts            # 맥 nsss — pyttsx3 미설치 시 자동 log 폴백
  rate_wpm: 200
  volume: 1.0
  event_templates:
    move_left: "왼쪽으로 이동"
    move_right: "오른쪽으로 이동"
    select: "선택했습니다"
    go_back: "이전 화면으로 이동합니다"
    go_home: "처음 화면으로 돌아갑니다"

classes:
  [move_left, move_right, select, go_back, go_home]

event_output:
  mode: console
  udp:
    host: 127.0.0.1
    port: 9999

demo_ui:
  host: 0.0.0.0
  port: 5001              # ★ 맥: 5000은 AirPlay 수신기가 선점 → 5001 사용
  stream_fps: 15
  jpeg_quality: 75

logging:
  level: INFO
  save_dir: logs/

runtime:
  python_version: "3.11.5"   # 배포 기준 — 맥 개발 venv(3.10)는 검증용이라 무관
  target_os: windows
  target_gpu: nvidia
  hardware:                  # 실제 개발 PC 명세 기록(2026-07-16) — config.yaml 주석 참고
    device_model: MacBook Pro (Apple M5 Pro — 개발·검증 PC)
    cpu: Apple M5 Pro
    ram: 64GB               # 시작 로그 실측으로 확인 (2026-07-16)
    accelerator: 없음 (CPU 실행 — 전신 모델 실측 28.9 FPS)
