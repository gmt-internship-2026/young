# gesture_kiosk 설정 — 모든 튜닝값의 단일 출처 (기획서 4.7 : 코드에 숫자 하드코딩 금지)
#
# 2026-07-10 전면 개편 — 타깃: 윈도우 CPU(GPU 불필요) + Python 3.11.5 (정부 민원발급기 — CPU 추론판)
# 2026-07-15 동작 체계 개편 (장애인·비장애인 범용 설계 — 포즈 단일 엔진):
#   팔 좌/우 쓸기=포커스 이동 · 아래로 쓸기=이전 화면(go_back) · 위로 쓸기=처음으로 /
#   고개 꾸벅 2회=선택. 모든 판정이 RTMPose 키포인트 하나로 끝난다 —
#   같은 날 2차에서 선택을 손등/팔등→꾸벅으로 재확정, 손 검출(MediaPipe)·팔등 CNN 제거.
# 2026-07-16 선택 동작 재확정 — 무손·무지 접근성 요건 제외(회사 확인), 꾸벅임은 UX 부담
#   으로 기각. 선택 = 손가락 1개(엄지 제외) 인식으로 교체, MediaPipe HandLandmarker 재도입
#   (hand_model 섹션 신설). 쓸기·잠금은 그대로 RTMPose 단일 엔진 유지.
# 2026-07-16 주민등록증 인식(OCR) 기능 전면 제거 — ocr 섹션·fill_id_fields 이벤트 삭제
#   (계획 변경). torch/torchvision(EasyOCR 전용)도 requirements에서 함께 제거.
# 2026-07-20 화면 전환 동작 재편 — go_home/go_back을 팔 위/아래 쓸기에서 손 위치의
#   위/아래 이동으로 교체(hand_swipe 섹션 신설). 팔은 좌/우 이동(move_left/move_right)
#   전용으로 남는다. hand_swipe는 손가락 개수를 안 본다(손 모양 무관, 손만 움직이면 됨)
#   — "손가락 1개"는 select 전용 신호로 남긴다(재확정: 굳이 손가락 1개가 아니어도 됨).
# 2026-07-23 동작 체계 전면 개편(사용자 확정 — 회사 스펙 변경) — 팔 쓸기(포즈)와 손
#   위치 이동(MediaPipe)으로 나뉘어 있던 판정을 손 모양+이동 하나로 통합:
#   point(검지 1개만 폄, "가리키기") + 좌/우/상/하 이동 = move_left/move_right/
#   move_up/move_down(포커스 이동 4방향). fist(주먹, 전부 접음) + 좌/우/상 이동 =
#   go_back/select/go_home(이전 화면/선택·확인/처음 화면). 아래(fist+down)는
#   미사용 — 회사 스펙에 정의되지 않음(사용자 확정). swipe(팔, 좌우 전용)·
#   hand_swipe(손, 상하 전용)·select(정지 유지) 세 섹션을 hand_move(이동 판정 1개)·
#   shapes(손 모양 판정)로 통폐합. 손 모양·이동이 이제 같은 MediaPipe 손 랜드마크
#   프레임에서 나와 항상 동기화된다(과거엔 팔 쓸기가 RTMPose 포즈 손목이라 손
#   모양을 반영할 수 없었다) — person_lock.user_swipe_points()·RTMPose 손목/팔꿈치
#   폴백은 더 이상 쓰이지 않아 제거. 무손 사용자 접근성 요건은 2026-07-16에 이미
#   계획에서 빠졌으므로(회사 확인) 이번 개편으로 새로 잃는 요건은 없다.

camera:
  device_id: 0            # USB 웹캠 장치 번호
  width_px: 1280
  height_px: 720
  mirror: true            # 거울 모드 — 사용자 기준 좌/우와 쓸기 방향을 일치시킨다
  windows_backend: msmf   # 윈도우 캡처 백엔드: msmf | dshow | auto
                          #   Brio 100 실측(2026-07-10): dshow는 YUY2 720p로만 협상돼 ~5 FPS,
                          #   msmf는 30 FPS. 오픈이 수십 초 걸리는 장치면 dshow로 되돌릴 것
  fourcc: mjpg            # 캡처 픽셀 포맷 — 무압축(YUY2) 720p는 USB 한계로 ~5 FPS. auto면 미설정
                          #   (msmf는 이 설정을 무시하기도 한다 — dshow 계열 카메라용)

model:
  # 라이선스(2026-07-15 2차): rtmlib RTMPose(Apache-2.0) — 쓸기(손목 궤적)·사용자 잠금
  # 담당. 선택(select)은 손가락 인식이라 아래 hand_model이 별도로 맡는다(2026-07-16)
  device: cpu             # CPU 추론판 고정 — GPU 가속판은 feat/think_win_gpu 브랜치
  use_tensorrt: false     # CPU판 — TensorRT 사용 불가 (GPU 가속은 feat/think_win_gpu)
  pose_mode: lightweight  # CPU 기본(30 FPS 확보용) — GPU판 기본은 balanced
  input_size_px: 640
  max_infer_fps: 30       # 추론 루프 FPS 상한 — 초과분은 대기 (GPU 낭비 방지)
                          #   KPI가 30 FPS — 60으로 두면 추론 루프가 캡처 스레드의
                          #   CPU/GIL을 빼앗아 캡처가 30→15 FPS로 반토막난다 (2026-07-10 실측)
  idle_infer_fps: 10      # 유휴(사람 없음·미잠금) 시 추론 FPS 하향 — 키오스크 대기 시간의
                          #   CPU·전력 절감. 사람이 감지되면 즉시 max_infer_fps로 복귀
                          #   (2026-07-20 GMtech feat/think_win_cpu 이식 — 성능 최적화만 채용,
                          #   같은 커밋의 검출 스킵은 우리 redetect_interval_frames로 대체됨)
  redetect_interval_frames: 10  # 2026-07-16 성능 최적화 — 잠금 상태에서는 매 프레임
                          #   재검출하지 않고 이 프레임 수마다 한 번만 전체 검출(infer)로
                          #   재동기화, 나머지는 infer_at_bbox()로 검출을 건너뛴다.
                          #   실측(이 CPU): 검출 포함 ~89ms vs bbox 재사용 ~22ms — 5배 차이.
                          #   너무 크면 빠르게 움직일 때 놓칠 수 있어 follow_radius_ratio·
                          #   release_sec와 같은 성격의 트레이드오프 — 실기에서 튜닝
  bbox_pad_ratio: 0.3     # infer_at_bbox() 호출 시 이전 bbox를 이 비율만큼 넓혀서 넘긴다
                          #   (재동기화 사이 프레임에서도 사람이 패딩 안에 남아있게)

hand_model:                # 손 랜드마크(MediaPipe HandLandmarker, Apache-2.0) — 선택(select)
                          # 판정 전용(2026-07-16 재도입). person_lock이 잠근 사용자의 bbox로
                          # 크롭한 영역만 추론해 CPU 30 FPS 예산·다른 사람 손 오인식을 막는다
  weights_path: models/weights/hand_landmarker.task  # 저장소에 포함 — 재다운로드 불필요
  num_hands: 1              # 크롭 안에서 손 1개만 보면 충분 — 오탐·연산 절약
  min_hand_detection_conf: 0.5
  min_hand_presence_conf: 0.5
  min_tracking_conf: 0.5
  infer_interval_frames: 2  # 2026-07-16 성능 최적화 — 포즈 검출 스킵(redetect_interval_frames)
                          #   적용 후 실측하니 손 인식이 새 병목이었다(단독 ~32ms, 포즈
                          #   패스트패스(~22ms)와 매 프레임 같이 돌리면 77.8ms/프레임까지
                          #   떨어짐). select.hold_sec(0.6초)는 몇 프레임 지연을 견디므로
                          #   매 프레임 대신 이 프레임 수마다 한 번만 재인식, 나머지는
                          #   마지막 결과를 재사용(realtime_loop.py — 절대 None으로
                          #   덮어쓰지 않는다: 그러면 유지 타이머가 매번 리셋된다)
                          #   ★2026-07-23 3→2(사용자 실기 리포트 — "선택이 잘 안 잡힘"):
                          #   실측 루프가 8.3 FPS(더미 벤치마크 23~30 FPS보다 훨씬 낮음)라
                          #   3이면 재인식 간격이 ~0.36초 — hold_sec(0.6초) 안에 신선한
                          #   샘플이 1~2번뿐이었다. 2로 낮춰 간격을 ~0.24초로 좁힘(FPS 소폭
                          #   하락과 맞바꿈 — 헤더의 "추론 FPS"로 영향 확인할 것)

person_lock:              # 오토포커스 카메라 — 초점 맞은 사용자에게 잠금, 다른 사람 무시
  enabled: true
  kpt_conf_threshold: 0.3     # 포즈 키포인트(손목·어깨·머리) 최소 신뢰도
  lock_frame_count: 3         # 최고 점수 후보가 N프레임 연속이면 그 사용자에게 잠금
  follow_radius_ratio: 0.25   # 잠금 유지·추적 반경 (프레임 폭 대비 비율)
  release_sec: 2.0            # 이 시간 동안 안 보이면 잠금 해제 — 다음 사용자 인식
  sharpness_weight: 0.5       # 사용자 선정 점수에서 초점 선명도 비중 (0=크기만, 1=선명도만)

gestures:
  cooldown_sec: 1.2           # 이벤트 확정 직후 입력 무시 시간 — 연타 방지.
                              #   hand_move.window_sec보다 길게 유지할 것 —
                              #   쿨다운이 지나면 궤적의 잔여 점이 전부 만료되게
  hand_move:                  # 손 위치 이동 판정 — 4방향 공용(2026-07-23 개편: 옛
                              #   swipe(팔, 좌우 전용)·hand_swipe(손, 상하 전용)를 통합).
                              #   어느 이벤트로 확정될지는 손 모양(gestures.shapes)에
                              #   달려 있다 — point면 move_*, fist면 select/go_back/go_home.
                              #   MediaPipe 손 랜드마크(손목, 0번)로 판정, hand_model.
                              #   infer_interval_frames 주기로만 갱신되는 값이라도 window_sec
                              #   안에 min_track_frames만큼은 쌓이도록 값을 맞췄다.
    window_sec: 1.0           # 이 시간 안의 이동량으로 판정 (cooldown_sec보다 짧게)
    min_dist_x_ratio: 0.18    # 좌/우 이동 확정 최소 이동 (프레임 폭 비율) — 옛 hand_swipe가
                              #   실측한 손 흔들림 잡음 상한(~0.12)보다는 크게, 옛 팔 쓸기
                              #   임계(0.25, 이제 못 쓸 전체 팔 스케일)보다는 작게 잡은
                              #   잠정치 — 손만으로 좌/우를 판정하는 건 이번이 처음이라
                              #   실기 재튜닝 전 가정값. 계기판 POINT/FIST x 진행도로 확인할 것
    min_dist_y_ratio: 0.05    # min_dist_up/down_ratio 둘 다 있으면 미사용 — 안전망으로만 유지
    min_dist_up_ratio: 0.09   # 위(go_home) 전용 — 옛 hand_swipe 3차 실측값 이어받음
    min_dist_down_ratio: 0.05 # 아래 전용 — 옛 hand_swipe 2차 실측값 이어받음 (현재 fist+down은
                              #   미사용이라 이 값은 point+아래(move_down)에만 적용된다)
    axis_dominance: 1.5       # 주축 진행도가 부축의 N배 이상일 때만 확정 — 대각선 오인 보류
    min_track_frames: 3       # 최소 궤적 프레임 — 키포인트 튐 1~2프레임 오발 방지
    return_suppress_sec: 0.0  # 복귀 스트로크 삼킴 — 기본 꺼짐. 옛 hand_swipe가 "손 이동엔
                              #   팔처럼 뚜렷한 중앙 쉬는 자세가 없어 켜면 정당한 반대 방향
                              #   시도까지 삼켜버렸다"(2026-07-23 2차 리포트)는 이유로 껐던
                              #   것을 그대로 승계 — 이번에 좌/우도 손 위치 기반으로 바뀌어
                              #   같은 문제가 재현될 가능성이 있다. 실기에서 "쓸기 후 되돌리는
                              #   동작이 반대 방향으로 또 잡힘" 리포트가 나오면 옛 swipe처럼
                              #   1.6초로 켜볼 것 (return_origin_ratio와 함께)
    return_origin_ratio: 0.15 # return_suppress_sec이 0이라 현재 미사용 — 나중에 켤 경우 대비
    point_filter:              # 추적점 One Euro 필터(2026-07-23, GMtech_project 이식) — 정지
                              #   시에도 손 키포인트가 프레임마다 떨려 궤적에 섞이면 진행도가
                              #   출렁여, 가만히 있어도 방향이 번갈아 확정되는 오탐이 났다
                              #   (구 swipe/hand_swipe 공통 문제였던 것을 그대로 승계). 값은
                              #   기존과 동일 — 이 CPU는 실측 FPS가 낮아(4~7 FPS) 필터 반응이
                              #   다를 수 있다. 실기 재확인 필요
      enabled: true
      min_cutoff_hz: 1.5      # 정지 시 컷오프 — 낮출수록 떨림 제거 강함(대신 느린 동작 지연↑)
      beta: 1.0               # 속도 반응 계수 — 클수록 빠른 이동에서 원신호를 더 믿는다(지연↓)
      d_cutoff_hz: 1.0        # 속도 추정 자체의 평활 컷오프 (보통 1.0 고정)
  shapes:                     # 손 모양 판정 — hand_estimator.count_extended_fingers(엄지
                              #   제외) 결과로 point/fist를 구분한다 (2026-07-23 신설).
    point_finger_count: 1     # 검지 1개만 폄 = "가리키기" → hand_move 결과가 move_left/
                              #   move_right/move_up/move_down으로 확정된다
    fist_finger_count: 0      # 전부 접음 = "주먹" → hand_move 결과가 select(우)/go_back(좌)/
                              #   go_home(상)으로 확정된다. 아래는 매핑 없음(미사용, 사용자 확정)
    extended_ratio: 1.3       # 2026-07-22 도입 — TIP-손목 거리가 PIP-손목 거리의 이 배수
                              #   이상이면 "폄"으로 판정(hand_estimator.count_extended_fingers).
                              #   손이 화면에서 수직이 아니어도(얼굴 옆 등으로 기울여 듦) 흔들리지
                              #   않는다. GMtech_project finger_select.py와 같은 값(가정값)

announce:                   # 토크백(보이스오버) — 현재 위치·기능 음성 안내
  enabled: true
  backend: tts              # tts(pyttsx3 — 윈도우 SAPI/맥 nsss) | log(개발용: 로그로만 출력)
  rate_wpm: 200             # 말하기 속도
  volume: 1.0
  voice_keyword: "Korean"   # pyttsx3 보이스 중 이름/id에 이 문자열(대소문자 무시)이 포함된
                             #   것을 선택 — 미설치·미일치면 기본 보이스로 폴백(경고 로그).
                             #   윈도우 SAPI 한국어 보이스(Heami 등)는 보통 이름에 "Korean"이
                             #   들어간다 — 실제 보이스명은 실기 확인 필요 (docs/TODO.md)
  event_templates:          # 제스처 이벤트 자동 안내 문구
    move_left: "왼쪽으로 이동"
    move_right: "오른쪽으로 이동"
    move_up: "위로 이동"
    move_down: "아래로 이동"
    select: "선택했습니다"
    go_back: "이전 화면으로 이동합니다"
    go_home: "처음 화면으로 돌아갑니다"
  status_templates:          # 사용자 인식 상태 전환 안내 (2026-07-16 추가) — person_lock이
                             #   잠금/해제될 때 1회만 안내한다(연속 프레임 반복 없음).
                             #   화면을 못 보는 사용자가 카메라에 인식됐는지 아는 유일한 수단
    locked: "사용자가 인식되었습니다"
    released: "사용자 인식이 해제되었습니다. 화면 앞에 서 주세요"
  # UI 화면 안내(현재 포커스 항목 설명)는 UI가 POST /announce {"text": "..."}로 요청한다
  # (회사 프로그램 연동 계약 — 이벤트는 엔진→UI, 음성 안내 요청은 UI→엔진)

classes:                    # 표준 동작 목록 — UI/이벤트 수신부와의 계약 (2026-07-23:
                              #   point+상하 이동으로 move_up/move_down 신설)
  [move_left, move_right, move_up, move_down, select, go_back, go_home]

event_output:
  # 2026-07-23 팀 확정(№7): 델파이7 실연동은 네임드 파이프로 결정 — event_sender.py의
  # PipeEventSender 참고(평문 명령어 7개: up/down/left/right/home/back/ok). pipe.name이
  # 아직 placeholder라 실제 파이프 이름 확정 전까지는 mode를 console로 둔다 —
  # 확정되면 mode: pipe로 전환할 것
  mode: console           # console | udp | pipe
  udp:                     # 개발·디버깅용 예시 — 실연동은 pipe
    host: 127.0.0.1
    port: 9999
  pipe:                    # 델파이7 네임드 파이프 — 델파이7이 서버, 이 엔진이 클라이언트
    name: '\\.\pipe\GestureKiosk'   # ★placeholder — 델파이7 개발자 확정 파이프 이름으로 교체 필요
    reconnect_backoff_sec: 2.0      # 연결 끊김 시 재접속 최소 간격 — WebSocketEventSender와
                                     #   같은 이유(GMtech_project 참고): 매 프레임 재시도로
                                     #   추론 루프를 막지 않기 위한 안전장치

demo_ui:                  # 예시 UI 서버 — 회사 프로그램 인수 후 제거 예정
  host: 0.0.0.0
  port: 5000
  stream_fps: 15
  jpeg_quality: 75

logging:
  level: INFO
  save_dir: logs/

runtime:                  # 배포 기준 명세 — 설치가이드.md와 일치해야 한다
  python_version: "3.11.5"
  target_os: windows
  target_gpu: none        # CPU 추론판
