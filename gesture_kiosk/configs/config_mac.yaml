# gesture_kiosk 맥(개발 PC) 전용 설정 — config.yaml과 같은 구조, 맥 환경 차이만 다르다
# 사용: python scripts/run_demo.py --config configs/config_mac.yaml
# 원본과 다른 점 (docs/MAC_RUN_LOG.md 참고):
#   demo_ui.port: 5000 → 5001   (맥 AirPlay 수신기(ControlCenter)가 5000 선점)
#   announce.backend: tts       (pyttsx3가 맥 nsss로 동작 — 미설치면 자동 log 폴백)

camera:
  device_id: 0            # 맥 내장(MacBook Pro) 카메라
  width_px: 1280
  height_px: 720
  mirror: true
  windows_backend: auto   # 맥에서는 무시된다
  fourcc: mjpg            # 캡처 픽셀 포맷 — 맥 내장 카메라는 무시될 수 있다 (무해)

model:
  # 라이선스(2026-07-15 2차): rtmlib RTMPose(Apache-2.0) — 쓸기·잠금. 맥은 CPU 실행(개발 확인용)
  device: auto            # 맥: CUDA 없음 -> 자동으로 cpu
  use_tensorrt: false
  pose_mode: lightweight  # ★ 맥 CPU — 가벼운 포즈 모델로 개발 확인
  input_size_px: 640
  max_infer_fps: 60
  idle_infer_fps: 10      # 유휴 시 추론 FPS 하향 — config.yaml 주석 참고 (2026-07-20 GMtech 이식)
  redetect_interval_frames: 10  # 2026-07-16 성능 최적화 — config.yaml 주석 참고
  bbox_pad_ratio: 0.3

hand_model:                # MediaPipe HandLandmarker(Apache-2.0) — 선택 판정 (2026-07-16 재도입)
  weights_path: models/weights/hand_landmarker.task
  num_hands: 1
  min_hand_detection_conf: 0.5
  min_hand_presence_conf: 0.5
  min_tracking_conf: 0.5
  infer_interval_frames: 2  # 2026-07-16 성능 최적화, 2026-07-23 3→2 — config.yaml 주석 참고

person_lock:
  enabled: true
  kpt_conf_threshold: 0.3
  lock_frame_count: 3
  follow_radius_ratio: 0.25
  release_sec: 2.0
  sharpness_weight: 0.5
  keypoint_bbox_pad_ratio: 0.4  # 2026-07-23 신설 — config.yaml 주석 참고 (손 크롭 범위 여유)

gestures:
  cooldown_sec: 1.2       # hand_move.window_sec보다 길게 (config.yaml 주석 참고)
  hand_move:               # 손 위치 이동 판정 4방향 공용 (2026-07-23 개편, swipe·hand_swipe
                           # 통합 — config.yaml 주석 참고). 어느 이벤트인지는 shapes로 결정
    window_sec: 1.0
    # 2026-07-24 GMtech_project(feat/think_win_cpu) 이식 — 어깨너비 배수 정규화, config.yaml 주석 참고
    min_dist_x_shoulder: 0.55
    min_dist_y_shoulder: 0.35
    min_dist_up_shoulder:      # 비워둠 — config.yaml 주석 참고
    min_dist_down_shoulder:    # 비워둠 — config.yaml 주석 참고
    axis_dominance: 1.5
    min_track_frames: 4
    flick_window_sec: 0.2
    flick_min_dist_shoulder: 0.28
    return_suppress_sec: 0.0  # 기본 꺼짐 — config.yaml 주석 참고(옛 hand_swipe 문제 승계)
    return_origin_shoulder: 0.6
    return_reach_shoulder: 0.4
    dropout_grace_sec: 0.15
    raise_guard_below_shoulder: 1.2
    raise_guard_grace_sec: 0.6
    body_scale:
      fallback_ratio: 0.22
      min_ratio: 0.05
      max_ratio: 0.32
      alpha: 0.1
    # classifier_weights_path: models/weights/direction_classifier.npz  # 2026-07-24 도입, config.yaml 주석 참고
    point_filter:            # One Euro 필터 — config.yaml 주석 참고 (정지 시 떨림 오탐 방지)
      enabled: true
      min_cutoff_hz: 1.5
      beta: 1.0
      d_cutoff_hz: 1.0
  shapes:                  # 손 모양 판정 — point/fist 구분 (2026-07-23 신설, config.yaml 주석 참고)
    point_finger_count: 1  # 검지 1개 = 가리키기 → left/right/top/bottom
    fist_finger_count: 0   # 주먹 → ok(우)/back(좌)/home(상), 아래 미사용
    extended_ratio: 1.3    # 2026-07-22, 2026-07-23 1.3→1.6→1.45→1.3(z 3차원 판정으로 원상복구) — config.yaml 주석 참고
    miss_grace_sec: 0.5    # 2026-07-23 도입 — config.yaml 주석 참고 (손가락 개수 흔들림 유예)
    # classifier_weights_path: models/weights/hand_shape_classifier.npz
                            # 2026-07-23 도입 — config.yaml 주석 참고 (학습된 분류기, 기본 꺼짐)

announce:
  enabled: true
  backend: tts            # 맥 nsss — pyttsx3 미설치 시 자동 log 폴백
  rate_wpm: 200
  volume: 1.0
  voice_keyword: "ko"      # 맥 nsss 보이스는 이름 대신 id에 로캘 코드(ko-KR 등)가
                            #   들어가는 경우가 많아 윈도우와 다른 키워드를 쓴다
                            #   (config.yaml 주석 참고) — 실제 보이스명은 실기 확인 필요
  event_templates:           # 키는 회사 확정 이벤트명 — config.yaml 주석 참고
    left: "왼쪽으로 이동"
    right: "오른쪽으로 이동"
    top: "위로 이동"
    bottom: "아래로 이동"
    ok: "선택했습니다"
    back: "이전 화면으로 이동합니다"
    home: "처음 화면으로 돌아갑니다"
  status_templates:
    locked: "사용자가 인식되었습니다"
    released: "사용자 인식이 해제되었습니다. 화면 앞에 서 주세요"

classes:
  [left, right, top, bottom, back, home, ok]

event_output:
  mode: console            # console | udp | stdio — stdio(델파이7 실연동)는 윈도우 전용
                            #   워크플로 확인용, 맥에서는 실질적으로 쓰지 않는다 —
                            #   config.yaml 주석 참고
  udp:
    host: 127.0.0.1
    port: 9999

demo_ui:
  host: 0.0.0.0
  port: 5001              # ★ 맥: 5000은 AirPlay 수신기가 선점 → 5001 사용
  stream_fps: 15
  jpeg_quality: 75

logging:
  level: INFO
  save_dir: logs/

runtime:
  python_version: "3.11.5"   # 배포 기준 — 맥 개발 venv(3.10)는 검증용이라 무관
  target_os: windows
  target_gpu: nvidia
