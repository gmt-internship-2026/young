<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제스처 민원발급기 — 예시 UI</title>
<style>
  :root {
    --bg: #10141c; --panel: #1a2230; --panel2: #202b3d; --line: #2e3d55;
    --text: #e8eef7; --dim: #8ea0bb; --accent: #35c46f; --warn: #f0a437; --danger: #e05555;
    --focus: #4da3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .banner { background: var(--warn); color: #1a1a1a; text-align: center; font-weight: 700; padding: 6px; font-size: 13px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; }
  header .stats { display: flex; gap: 14px; font-size: 13px; color: var(--dim); }
  header .stats b { color: var(--accent); }
  .badge { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .badge.on { background: var(--accent); color: #10141c; }
  .badge.off { background: var(--panel2); color: var(--dim); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 14px; color: var(--dim); margin-bottom: 10px; }
  #cam { width: 100%; border-radius: 8px; background: #000; min-height: 300px; }
  .guide { margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.9; }
  .guide span { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; margin-right: 6px; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .screen-head .title { font-size: 17px; font-weight: 700; }
  .screen-head .hint { color: var(--dim); font-size: 12px; }
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps .step { flex: 1; text-align: center; font-size: 11px; color: var(--dim); background: var(--panel2);
                 border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; }
  .steps .step.active { color: #10141c; background: var(--focus); border-color: var(--focus); font-weight: 700; }
  .steps .step.done { color: var(--accent); border-color: var(--accent); }
  .menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .item { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 22px 10px; text-align: center; font-size: 14px; transition: 0.15s; }
  .item.hl { border-color: var(--focus); box-shadow: 0 0 12px rgba(77,163,255,0.35); }
  .copies-row { display: flex; gap: 10px; justify-content: center; margin: 30px 0; }
  .copies-row .item { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
                       font-size: 20px; font-weight: 700; padding: 0; }
  .fee-summary { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .fee-summary .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); padding: 4px 0; }
  .fee-summary .row.total { color: var(--text); font-weight: 700; font-size: 18px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .btnrow { display: flex; gap: 10px; }
  .btn { flex: 1; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; font-weight: 700; }
  .btn.hl { border-color: var(--focus); box-shadow: 0 0 12px rgba(77,163,255,0.35); }
  .btn.danger.hl { border-color: var(--danger); box-shadow: 0 0 12px rgba(224,85,85,0.35); }
  .printing { text-align: center; padding: 50px 0; }
  .printing .spinner { font-size: 40px; margin-bottom: 16px; animation: spin 1.2s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .progress-track { background: var(--panel2); border-radius: 20px; height: 10px; overflow: hidden; margin: 18px auto; width: 80%; }
  .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 1.6s linear; }
  .receipt { background: #f4f1e8; color: #1a1a1a; border-radius: 6px; padding: 20px; font-family: 'Courier New', monospace;
             box-shadow: 0 6px 20px rgba(0,0,0,0.35); position: relative; }
  .receipt::before, .receipt::after { content: ""; position: absolute; left: 0; right: 0; height: 8px;
             background: repeating-linear-gradient(45deg, #f4f1e8 0 6px, var(--bg) 6px 12px); }
  .receipt::before { top: -4px; } .receipt::after { bottom: -4px; }
  .receipt .center { text-align: center; }
  .receipt .big { font-size: 20px; font-weight: 700; margin: 8px 0; }
  .receipt hr { border: none; border-top: 1px dashed #999; margin: 10px 0; }
  .receipt .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  .receipt .row.total { font-weight: 700; font-size: 15px; }
  .done-note { color: var(--dim); font-size: 13px; line-height: 1.8; text-align: center; margin-top: 16px; }
  #evlog { list-style: none; font-size: 12px; color: var(--dim); max-height: 130px; overflow-y: auto; }
  #evlog li { padding: 3px 0; border-bottom: 1px solid var(--panel2); }
  #evlog b { color: var(--text); }
</style>
</head>
<body>
<div class="banner">⚠ 예시 UI — 회사 키오스크 프로그램으로 교체 예정 (연동 계약: /data 이벤트 · POST /announce)</div>
<header>
  <h1>배리어프리 민원발급기 <small style="color:var(--dim);font-size:12px;">제스처 인식 데모</small></h1>
  <div class="stats">
    <span id="b-lock" class="badge off">사용자 인식 대기</span>
    <span>추론 <b id="s-infer">-</b> FPS</span>
    <span>카메라 <b id="s-cap">-</b> FPS</span>
  </div>
</header>
<main>
  <section class="panel">
    <h2>실시간 인식 화면 (CAM)</h2>
    <img id="cam" src="/video_feed" alt="camera stream">
    <div class="guide">
      <span>☝ 가리키고 좌/우 이동</span>같은 줄 포커스 이동 &nbsp; <span>☝ 가리키고 상/하 이동</span>줄 단위 포커스 이동<br>
      <span>✊ 주먹 내밀고 우측 이동</span>선택·확인 &nbsp; <span>✊ 주먹 내밀고 좌측 이동</span>이전 화면 &nbsp; <span>✊ 주먹 내밀고 상단 이동</span>처음으로
    </div>
    <div class="guide" id="dbg" style="margin-top:6px;"></div>
    <div style="margin-top:12px;">
      <h2>이벤트 로그</h2>
      <ul id="evlog"></ul>
    </div>
  </section>
  <section class="panel" id="screen"></section>
</main>

<script>
// ── 민원발급기 예시 화면 5단계: 증명서 선택 → 부수 선택 → 결제 확인 → 발급 중 → 완료 ──
const CERTS = [
  { name: "주민등록표 등본", fee: 400 },
  { name: "주민등록표 초본", fee: 400 },
  { name: "가족관계증명서", fee: 1000 },
  { name: "건축물대장", fee: 500 },
  { name: "토지(임야)대장", fee: 500 },
  { name: "지방세 납세증명", fee: 0 },
];
const COPIES_OPTIONS = [1, 2, 3, 4, 5];
const PAY_BUTTONS = ["발급하기", "취소"];
const STEPS = ["증명서 선택", "부수 선택", "결제 확인", "발급 중"];
const STEP_INDEX = { home: 0, copies: 1, pay: 2, printing: 3 };
const PRINT_DURATION_MS = 1800;

// 화면마다 {name, focusIdx}를 스택에 쌓는다 — go_back으로 돌아왔을 때 그 화면에서
// 마지막으로 고르고 있던 포커스(예: 부수 3개)가 그대로 복원되게 하기 위해서다
// (단일 focusIdx였다면 뒤로 가기가 포커스를 0으로 되돌려 선택이 조용히 바뀌는 문제가 있었다)
let screenStack = [{ name: "home", focusIdx: 0 }];
let chosenCert = null;
let copiesCount = 1;
let lastEventTs = 0;

const $ = (id) => document.getElementById(id);
const screen = () => screenStack[screenStack.length - 1].name;
const focusIdx = () => screenStack[screenStack.length - 1].focusIdx;
const won = (n) => (n === 0 ? "무료" : `${n.toLocaleString()}원`);

function focusLabels() {
  const s = screen();
  if (s === "home") return CERTS.map((c) => c.name);
  if (s === "copies") return COPIES_OPTIONS.map(String);
  if (s === "pay") return PAY_BUTTONS;
  if (s === "printing") return [];       // 발급 중 — 입력 무시
  return ["처음으로"];                    // done
}

// 화면별 그리드 열 수 — up/down을 "한 줄 위/아래로 이동"으로 구현하기 위한 보폭.
// 홈 화면만 3열 그리드(.menu, CSS 참고)이고 나머지는 한 줄이라 열 수 = 항목 수.
function focusCols() {
  const s = screen();
  if (s === "home") return 3;
  return focusLabels().length || 1;
}

async function announce(text) {  // 화면 맥락 안내는 UI가 요청한다 (연동 계약 시연)
  try {
    await fetch("/announce", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ text }) });
  } catch (err) { /* 엔진 재시작 중 실패는 무시 */ }
}

function setFocus(nextIdx) {
  const labels = focusLabels();
  if (labels.length === 0) return;        // printing 등 포커스 없는 화면
  const idx = (nextIdx + labels.length) % labels.length;  // 끝에서 다음 줄 첫째칸(토크백식 랩)
  screenStack[screenStack.length - 1].focusIdx = idx;
  render();
  announce(labels[idx]);
}

function goForward(nextScreen) {
  screenStack.push({ name: nextScreen, focusIdx: 0 });
  onEnterScreen(nextScreen);
}

function goBack() {
  if (screenStack.length <= 1) return;    // home에서는 무시
  screenStack.pop();                      // 이전 화면의 focusIdx가 그대로 복원된다
  onEnterScreen(screen());
}

function goHome() {
  screenStack = [{ name: "home", focusIdx: 0 }];
  chosenCert = null;
  copiesCount = 1;
  onEnterScreen("home");
}

function onEnterScreen(s) {
  if (s === "home") announce("증명서 선택 화면. 발급할 증명서를 선택하세요");
  else if (s === "copies") announce("발급 부수를 선택하세요");
  else if (s === "pay") announce(`총 ${won(chosenCert.fee * copiesCount)}입니다. 발급하시겠습니까?`);
  else if (s === "printing") {
    announce("발급 처리 중입니다. 잠시만 기다려 주세요");
    setTimeout(() => {
      screenStack.push({ name: "done", focusIdx: 0 });
      render();
      announce(`${chosenCert.name} 발급이 완료되었습니다`);
    }, PRINT_DURATION_MS);
  }
  render();
  if (s === "printing") {
    requestAnimationFrame(() => {
      const fill = document.querySelector(".progress-fill");
      if (fill) fill.style.width = "100%";
    });
  }
}

function applyEvent(e) {
  // 2026-07-23 회사 확정 이벤트명(left/right/up/down/back/home/ok) 반영 —
  // 상하 이동은 엔진이 판정만 하고 줄 단위 이동은 UI 책임(README "상하 포커스
  // 이동" 참고)이라 focusCols() 보폭만큼 이동시킨다(홈 3열 그리드, 나머지는 1줄)
  const s = screen();
  if (s === "printing") return;           // 발급 중엔 모든 입력 무시
  if (e.class_name === "home") { goHome(); return; }
  if (e.class_name === "back") { goBack(); return; }
  if (e.class_name === "left")  setFocus(focusIdx() - 1);
  if (e.class_name === "right") setFocus(focusIdx() + 1);
  if (e.class_name === "up")    setFocus(focusIdx() - focusCols());
  if (e.class_name === "down")  setFocus(focusIdx() + focusCols());
  if (e.class_name === "ok") {
    const idx = focusIdx();
    if (s === "home") { chosenCert = CERTS[idx]; goForward("copies"); }
    else if (s === "copies") { copiesCount = COPIES_OPTIONS[idx]; goForward("pay"); }
    else if (s === "pay") {
      if (PAY_BUTTONS[idx] === "발급하기") goForward("printing");
      else goHome();
    }
    else goHome();                        // done에서 ok — 처음으로
  }
}

function stepsHtml() {
  const activeIdx = STEP_INDEX[screen()];
  if (activeIdx === undefined) return "";  // done — 단계 표시 없음
  return `<div class="steps">${STEPS.map((label, i) => {
    const cls = i === activeIdx ? "active" : i < activeIdx ? "done" : "";
    return `<div class="step ${cls}">${i + 1}. ${label}</div>`;
  }).join("")}</div>`;
}

function render() {
  const s = $("screen");
  const scr = screen();
  const fIdx = focusIdx();
  const steps = stepsHtml();

  if (scr === "home") {
    // 처음 화면은 원래 데모 UI처럼 단계 표시줄·수수료 없이 단순하게 유지한다
    s.innerHTML = `
      <div class="screen-head"><div class="title">증명서 선택</div>
        <div class="hint">☝ 가리키고 좌/우 이동 · ✊ 주먹 내밀고 우측 이동 선택</div></div>
      <div class="menu">${CERTS.map((c, i) =>
        `<div class="item ${i === fIdx ? "hl" : ""}">${c.name}</div>`).join("")}</div>`;
  } else if (scr === "copies") {
    s.innerHTML = steps + `
      <div class="screen-head"><div class="title">발급 부수 선택 — ${chosenCert.name}</div>
        <div class="hint">☝ 가리키고 좌/우 이동 · ✊ 주먹 내밀고 우측 이동 선택</div></div>
      <div class="copies-row">${COPIES_OPTIONS.map((n, i) =>
        `<div class="item ${i === fIdx ? "hl" : ""}">${n}부</div>`).join("")}</div>`;
  } else if (scr === "pay") {
    const total = chosenCert.fee * copiesCount;
    s.innerHTML = steps + `
      <div class="screen-head"><div class="title">결제 확인</div>
        <div class="hint">✊ 주먹 내밀고 우측 이동 선택</div></div>
      <div class="fee-summary">
        <div class="row"><span>${chosenCert.name}</span><span>${won(chosenCert.fee)} × ${copiesCount}부</span></div>
        <div class="row total"><span>결제 금액</span><span>${won(total)}</span></div>
      </div>
      <div class="btnrow">${PAY_BUTTONS.map((b, i) =>
        `<div class="btn ${b === "취소" ? "danger" : ""} ${i === fIdx ? "hl" : ""}">${b}</div>`).join("")}</div>`;
  } else if (scr === "printing") {
    s.innerHTML = steps + `
      <div class="printing">
        <div class="spinner">🖨️</div>
        <div>${chosenCert.name} ${copiesCount}부 발급 처리 중...</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>`;
  } else {
    const total = chosenCert.fee * copiesCount;
    s.innerHTML = `
      <div class="receipt">
        <div class="center">✅ 발급 완료</div>
        <div class="center big">${chosenCert.name}</div>
        <hr>
        <div class="row"><span>수량</span><span>${copiesCount}부</span></div>
        <div class="row"><span>단가</span><span>${won(chosenCert.fee)}</span></div>
        <div class="row total"><span>결제 금액</span><span>${won(total)}</span></div>
        <hr>
        <div class="row"><span>발급 시각</span><span>${new Date().toLocaleTimeString("ko-KR")}</span></div>
      </div>
      <div class="done-note">출력물을 받아 가세요.<br>✋⬆ 손을 위로 이동하면 처음 화면으로 돌아갑니다.</div>`;
  }
}

async function poll() {
  try {
    const d = await (await fetch("/data")).json();
    $("s-infer").textContent = d.stats.infer_fps;
    $("s-cap").textContent = d.stats.capture_fps;

    const lock = $("b-lock");
    lock.className = "badge " + (d.status.is_user_locked ? "on" : "off");
    lock.textContent = d.status.is_user_locked ? "사용자 고정됨" : "사용자 인식 대기";

    const g = d.debug || {};
    const swallowBits = [["P", g.swallow_point], ["F", g.swallow_fist]]
      .filter(([, v]) => v).map(([k, v]) => `${k}:${v}`).join(" ");
    $("dbg").textContent = `계기판 — 손가락 ${g.finger_count ?? "-"} · 모양 ${g.hand_shape ?? "-"} · 가리키기 x${g.point_x ?? 0} y${g.point_y ?? 0} · 주먹 x${g.fist_x ?? 0} y${g.fist_y ?? 0}${swallowBits ? ` · 복귀무시 예약(${swallowBits})` : ""}`;

    const log = $("evlog");
    log.innerHTML = d.events.slice().reverse().map(e =>
      `<li><b>${e.class_name}</b>${e.shape ? ` (${e.shape})` : ""} conf=${e.conf}</li>`).join("");
    for (const e of d.events) {
      if (e.ts_sec > lastEventTs) { lastEventTs = e.ts_sec; applyEvent(e); }
    }
  } catch (err) { /* 서버 재시작 중 폴링 실패는 무시 */ }
}
render();
setInterval(poll, 250);
</script>
</body>
</html>
